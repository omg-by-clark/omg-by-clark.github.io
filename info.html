<html lang="zh-CN">

<head>
    <link href="logo.svg" rel="icon" type="image/svg+xml">
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0, user-scalable=no" name="viewport">
    <title>个人信息 Info • omg-by-Clark</title>
    <style>
        /* [:root] 定义全局 CSS 变量，包括背景色、文字颜色和品牌主色 */
        :root {
            --bg: #fffdf5;
            --text: #333;
            --brand: #ff4757;
            --card: #fff;
            --disabled: #bdc3c7;
            --checkin: linear-gradient(135deg, #fab387, #f9e2af);
        }

        /* [body.dark] 定义暗黑模式下的颜色变量替换 */
        body.dark {
            --brand: #ff6b81;
            --bg: #121212;
            --text: #f1f2f6;
            --card: #1e1e1e;
            --disabled: #444;
        }

        /* selection 用途：设置用户选择时的字体颜色 */
        ::selection {
            background: hsla(355, 100%, 75%, 0.3);
        }

        /* [body] 页面基础样式，使用 Flex 布局使内容居中 */
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            transition: background-color 0.3s;
        }

        /* [.info-card] 个人信息卡片容器，包含阴影和圆角效果 */
        .info-card {
            text-align: center;
            padding: 30px;
            width: 90%;
            max-width: 400px;
            background: var(--card);
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            position: relative; /* 为签到气泡定位提供参考 */
        }

        /* [.avatar-container] 头像展示区域，点击可触发文件选择 */
        .avatar-container {
            position: relative;
            width: 80px;
            height: 80px;
            margin: 0 auto 15px;
            cursor: pointer;
        }

        /* [#avatar-img] 实际显示的头像图片，设定为圆形并覆盖容器 */
        #avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--brand);
            background: #eee;
        }

        /* [.avatar-upload-hint] 鼠标悬停在头像上时显示的修改提示 */
        .avatar-upload-hint {
            position: absolute;
            bottom: 0;
            right: 0;
            background: var(--brand);
            color: white;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            font-size: 14px;
            line-height: 24px;
        }

        /* [.lv-badge] 等级徽章的基础样式 */
        .lv-badge {
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.85em;
            font-weight: bold;
            display: inline-block;
            margin-left: 8px;
            vertical-align: middle;
            position: relative;
        }

        /* [.lv-log] 原木等级颜色 */
        .lv-log {
            background: #a1662f;
            color: white;
        }

        /* [.lv-bronze] 青铜等级颜色 */
        .lv-bronze {
            background: #cd7f32;
            color: white;
        }

        /* [.lv-iron] 黑铁等级颜色 */
        .lv-iron {
            background: #555555;
            color: white;
        }

        /* [.lv-silver] 白银等级颜色 */
        .lv-silver {
            background: #e0e0e0;
            color: #000;
        }

        /* [.lv-gold] 黄金等级颜色 */
        .lv-gold {
            background: #ffd700;
            color: black;
        }

        /* [.lv-diamond] 钻石等级颜色 */
        .lv-diamond {
            background: #add8e6;
            color: #0000ff;
        }

        /* [.lv-king] 王者等级样式 */
        .lv-king {
            background: linear-gradient(45deg, #ffd700, #ffaa00);
            color: #fff;
            padding-right: 18px;
        }

        /* [.lv-king::after] 王者等级的 V 字符装饰 */
        .lv-king::after {
            content: "V";
            position: absolute;
            right: 4px;
            color: #fff;
            font-weight: 900;
            font-style: italic;
        }

        /* [.lv-epic] 史诗等级样式 */
        .lv-epic {
            background: linear-gradient(45deg, #a333c8, #6d28d9);
            color: #fff;
            padding-right: 18px;
        }

        /* [.lv-epic::after] 史诗等级的 V 字符装饰 */
        .lv-epic::after {
            content: "V";
            position: absolute;
            right: 4px;
            color: #fff;
            font-weight: 900;
            font-style: italic;
        }

        /* [ul] 信息列表样式，取消默认列表符号 */
        ul {
            list-style: none;
            padding: 0;
            line-height: 2.5;
            text-align: left;
            width: 100%;
            margin-bottom: 20px;
        }

        /* [.btn-checkin] 签到按钮样式 */
        .btn-checkin {
            background: var(--checkin);
            color: #1e1e2e;
            border: none;
            padding: 10px 24px;
            border-radius: 50px;
            cursor: pointer;
            width: auto;
            display: inline-block;
            font-size: 0.95em;
            font-weight: bold;
            margin: 10px 0 20px 0;
            box-shadow: 0 4px 12px rgba(250, 179, 135, 0.3);
            transition: transform 0.2s, filter 0.2s;
            position: relative; /* 方便气泡在其上方显示 */
        }

        /* [.btn-checkin:active] 按钮点击时的缩放反馈 */
        .btn-checkin:active {
            transform: scale(0.95);
        }

        /* [.btn-checkin.disabled] 签到后的禁用状态样式 */
        .btn-checkin.disabled {
            background: var(--disabled) !important;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
            color: white;
        }

        /* [.streak-bubble] 连签气泡动画样式 */
        .streak-bubble {
            position: absolute;
            top: -45px;
            left: 50%;
            transform: translateX(-50%);
            background: #f08400;
            color: white;
            padding: 5px 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            white-space: nowrap;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            animation: bubbleUp 2s ease-out forwards;
            pointer-events: none;
            z-index: 100;
        }

        /* [bubbleUp] 气泡升起并消失的动画 */
        @keyframes bubbleUp {
            0% { opacity: 0; transform: translate(-50%, 0); }
            20% { opacity: 1; transform: translate(-50%, -10px); }
            80% { opacity: 1; transform: translate(-50%, -15px); }
            100% { opacity: 0; transform: translate(-50%, -25px); }
        }

        /* [.pwd-section] 修改密码区域的顶部分隔线 */
        .pwd-section {
            margin-top: 25px;
            border-top: 1px dashed #ccc;
            padding-top: 20px;
            text-align: left;
        }

        /* [.pwd-input] 密码输入框通用样式 */
        .pwd-input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            background: var(--bg);
            color: var(--text);
            outline: none;
        }

        /* [.btn-update] 确认修改按钮样式 */
        .btn-update {
            background: var(--brand);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            margin-top: 12px;
            transition: transform 0.1s;
        }

        /* [.btn-update:active] 确认修改按钮点击反馈 */
        .btn-update:active {
            transform: scale(0.98);
        }

        /* [.back-link] 返回首页链接样式 */
        .back-link {
            color: #888;
            text-decoration: none;
            font-weight: bold;
            margin-top: 25px;
            display: block;
            transition: transform 0.1s;
        }

        /* [.back-link:active] 返回链接点击缩放 */
        .back-link:active {
            transform: scale(1.1);
        }
    </style>
</head>

<body>
    <div class="info-card">
        <h1 data-en="👤 User Info" data-zh="👤 个人信息">👤 个人信息</h1>

        <div class="avatar-container" onclick="document.getElementById('avatar-input').click()">
            <img id="avatar-img" src="https://via.placeholder.com/80?text=..." alt="Avatar">
            <div class="avatar-upload-hint">✎</div>
        </div>
        <input type="file" id="avatar-input" accept="image/*" style="display: none"
            onchange="handleAvatarUpload(event)">

        <ul id="info-list">
            <li id="u-name">👤 Loading...</li>
            <li id="u-points">💰 Points: 0</li>
            <li id="u-level">🥇 Level: <span class="lv-badge lv-log">...</span></li>
            <li id="u-last-check">📅 Last Check-in: -</li>
            <li id="u-check-count">🔢 Total Check-ins: 0</li>
        </ul>

        <button class="btn-checkin" id="btn-checkin" onclick="dailyCheckIn()">
            📅 <span data-en="Check-in Now" data-zh="每日签到">每日签到</span>
        </button>

        <div class="pwd-section">
            <button data-en="🔐 Change Password" data-zh="🔐 修改密码" onclick="togglePwdForm()"
                style="background:none; border:none; color:var(--brand); cursor:pointer; font-weight:bold;">🔐 修改密码
            </button>
            <div id="pwd-form" style="display:none; margin-top:10px;">
                <input class="pwd-input" data-en-ph="Current Password" data-zh-ph="输入原密码" id="old-pwd" type="password">
                <input class="pwd-input" data-en-ph="New Password (min 6)" data-zh-ph="输入新密码 (至少6位)" id="new-pwd"
                    type="password">
                <button class="btn-update" data-en="Confirm Change" data-zh="确认修改" onclick="updatePassword()">确认修改
                </button>
            </div>
        </div>

        <a class="back-link" data-en="🏠 Back Home" data-zh="🏠 返回首页" href="index.html">
            🏠 返回首页
        </a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="db.js"></script>
    <script>
        const lang = localStorage.getItem('lang') || 'zh';
        let currentPoints = 0;
        let currentCheckInCount = 0;
        let currentStreak = 0; // 新增：记录当前连签天数
        let lastCheckInDate = null; // 新增：记录最后签到日期对象

        // escapeHTML 函数用于将特殊字符转义为 HTML 实体，防止用户输入的恶意代码被浏览器执行
        function escapeHTML(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        /* formatRelativeTime
        用法：把最后签到时间转换成用户更容易理解的相对时间。
        返回：中文示例为“刚刚 / 1 分钟前 / 昨天 / 2 天前 / 1 个月前 / 1 年前”，英文模式返回对应英文。
        原理：用当前时间减去最后签到时间，再按分钟、小时、天、月、年分段取整；这里只影响展示，不影响今日是否已签到和连签逻辑。
        */
        function formatRelativeTime(dateInput) {
            const date = new Date(dateInput);
            if (Number.isNaN(date.getTime())) return '';

            const diffMs = Date.now() - date.getTime();
            const seconds = Math.max(0, Math.floor(diffMs / 1000));
            const minutes = Math.floor(seconds / 60);
            const hours = Math.floor(minutes / 60);
            const days = Math.floor(hours / 24);
            const months = Math.floor(days / 30);
            const years = Math.floor(days / 365);

            if (lang === 'en') {
                if (seconds < 60) return 'just now';
                if (minutes < 60) return minutes === 1 ? '1 minute ago' : `${minutes} minutes ago`;
                if (hours < 24) return hours === 1 ? '1 hour ago' : `${hours} hours ago`;
                if (days === 1) return 'yesterday';
                if (days < 30) return `${days} days ago`;
                if (months < 12) return months === 1 ? '1 month ago' : `${months} months ago`;
                return years === 1 ? '1 year ago' : `${years} years ago`;
            }

            if (seconds < 60) return '刚刚';
            if (minutes < 60) return `${minutes} 分钟前`;
            if (hours < 24) return `${hours} 小时前`;
            if (days === 1) return '昨天';
            if (days < 30) return `${days} 天前`;
            if (months < 12) return `${months} 个月前`;
            return `${years} 年前`;
        }

        // getSafeFileName 函数将用户名进行 Base64 编码，解决 Supabase 存储桶不支持中文字符路径的问题
        function getSafeFileName(username) {
            return btoa(encodeURIComponent(username)).replace(/=/g, "");
        }

        // getNickStyle 函数根据用户背包中的道具 ID 和有效期，返回对应的 CSS 样式字符串
        function getNickStyle(inventory) {
            if (!inventory) return '';
            const now = new Date();
            if (inventory['100'] && new Date(inventory['100']) > now) {
                return 'background: linear-gradient(to right, #d20f39, #fe640b, #df8e1d, #40a02b, #04a5e5, #8839ef); -webkit-background-clip: text; color: transparent; font-weight: bold;';
            }
            if (inventory['101'] && new Date(inventory['101']) > now) {
                return 'color: #04a5e5; font-weight: bold;';
            }
            if (inventory['102'] && new Date(inventory['102']) > now) {
                return 'color: #f9e2af; font-weight: bold; text-shadow: 0 0 5px rgba(250, 179, 135, 0.5);';
            }
            return '';
        }

        // togglePwdForm 函数切换修改密码表单的显示或隐藏状态
        function togglePwdForm() {
            const f = document.getElementById('pwd-form');
            f.style.display = f.style.display === 'none' ? 'block' : 'none';
        }

        // handleAvatarUpload 函数负责处理用户选取的图片文件，包括 5MB 大小检查、转 WebP 以及上传
        async function handleAvatarUpload(event) {
            const file = event.target.files[0];
            const username = localStorage.getItem('username');
            if (!file || !username) return;

            if (file.size > 5 * 1024 * 1024) {
                alert(lang === 'zh' ? "图片太大啦，不能超过 5MB 哦！" : "Image too large, max 5MB!");
                return;
            }

            const imgElement = document.getElementById('avatar-img');
            const originalSrc = imgElement.src;
            imgElement.src = "https://via.placeholder.com/80?text=⏳";

            try {
                const webpBlob = await convertToWebP(file);
                const safeName = getSafeFileName(username);

                const { data, error } = await _supabase.storage
                    .from('avatars')
                    .upload(`${safeName}.webp`, webpBlob, {
                        contentType: 'image/webp',
                        upsert: true
                    });

                if (error) throw error;

                imgElement.src = URL.createObjectURL(webpBlob);
                alert(lang === 'zh' ? "头像更新成功！" : "Avatar updated!");
            } catch (err) {
                console.error(err);
                alert(lang === 'zh' ? "上传失败：" + err.message : "Upload failed: " + err.message);
                imgElement.src = originalSrc;
            }
        }

        function convertToWebP(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        canvas.width = img.width;
                        canvas.height = img.height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0);
                        canvas.toBlob((blob) => {
                            if (blob) resolve(blob);
                            else reject(new Error("Canvas conversion failed"));
                        }, 'image/webp', 0.8);
                    };
                    img.onerror = reject;
                };
                reader.onerror = reject;
            });
        }

        function loadAvatarUrl(username) {
            const safeName = getSafeFileName(username);
            const { data } = _supabase.storage.from('avatars').getPublicUrl(`${safeName}.webp`);
            return data.publicUrl + "?t=" + new Date().getTime();
        }

        // init 函数在页面加载时运行，初始化翻译、读取用户信息以及加载用户头像
        async function init() {
            if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark');
            const user = localStorage.getItem('username');
            if (!user) {
                alert(localStorage.getItem('lang') === 'zh' ? '你还没有登录，请先登录再查看个人信息！' : 'You have not signed in yet, please sign in now!');
                window.location.href = 'sign-in.html';
                return;
            }

            document.querySelectorAll('[data-zh]').forEach(el => {
                el.innerText = lang === 'zh' ? el.getAttribute('data-zh') : el.getAttribute('data-en');
            });
            document.querySelectorAll('[data-zh-ph]').forEach(el => {
                el.placeholder = lang === 'zh' ? el.getAttribute('data-zh-ph') : el.getAttribute('data-en-ph');
            });

            document.getElementById('avatar-img').src = loadAvatarUrl(user);

            const { data } = await _supabase.from('users').select('*').eq('username', user).single();
            if (data) {
                currentPoints = data.points || 0;
                currentCheckInCount = data.check_in_count || 0;
                currentStreak = data.daily_streak || 0; // 从数据库读取连签天数

                const lv = getLevelInfo(currentPoints);
                const nStyle = getNickStyle(data.inventory);
                const safeName = escapeHTML(data.username);

                document.getElementById('u-name').innerHTML = (lang === 'zh' ? "👤 用户名: " : "👤 Username: ") +
                    `<span style="${nStyle}">${safeName}</span>`;

                document.getElementById('u-points').innerText = (lang === 'zh' ? "💰 积分: " : "💰 Points: ") + currentPoints;
                document.getElementById('u-level').innerHTML = (lang === 'zh' ? "🥇 等级: " : "🥇 Level: ") +
                    `<span class="lv-badge ${lv.class}">${lv.name}</span>`;

                document.getElementById('u-check-count').innerText = (lang === 'zh' ? "🔢 签到次数: " : "🔢 Total Check-ins: ") + currentCheckInCount;

                if (data.last_check_in) {
                    lastCheckInDate = new Date(data.last_check_in);
                    const readableDate = formatRelativeTime(data.last_check_in);
                    document.getElementById('u-last-check').innerText = (lang === 'zh' ? "📅 最后签到: " : "📅 Last Check-in: ") + readableDate;

                    // 检查今天是否已经签到
                    if (lastCheckInDate.toDateString() === new Date().toDateString()) {
                        const btn = document.getElementById('btn-checkin');
                        btn.classList.add('disabled'); // 变为 --disabled 颜色
                        btn.innerText = lang === 'zh' ? "✅ 今天已签到" : "✅ Checked In";
                        btn.disabled = true; // 彻底禁用按钮点击
                    }
                } else {
                    document.getElementById('u-last-check').innerText = (lang === 'zh' ? "📅 最后签到: 暂无" : "📅 Last Check-in: None");
                }
            }
        }

        // dailyCheckIn 函数执行签到操作，更新数据库中的积分、最后签到时间以及连签天数
        async function dailyCheckIn() {
            const user = localStorage.getItem('username');
            const btn = document.getElementById('btn-checkin');
            if (btn.disabled) return;

            const reward = Math.floor(Math.random() * 10) + 1;
            const newPoints = currentPoints + reward;
            const newCheckInCount = currentCheckInCount + 1;
            const now = new Date();
            const nowISO = now.toISOString();

            // 计算连签逻辑：检查最后一次签到是不是昨天
            let newStreak = 1; // 默认重新开始连签
            if (lastCheckInDate) {
                const yesterday = new Date();
                yesterday.setDate(now.getDate() - 1);

                // 如果最后签到日期等于昨天，则连签 +1
                if (lastCheckInDate.toDateString() === yesterday.toDateString()) {
                    newStreak = currentStreak + 1;
                } else if (lastCheckInDate.toDateString() === now.toDateString()) {
                    // 防止并发操作，如果已经是今天则不处理
                    return;
                }
            }

            btn.innerText = "⏳ ...";
            btn.disabled = true;

            const { error } = await _supabase.from('users').update({
                points: newPoints,
                last_check_in: nowISO,
                check_in_count: newCheckInCount,
                daily_streak: newStreak // 更新连签字段
            }).eq('username', user);

            if (!error) {
                // 如果连签天数大于1，弹出彩色对话框（气泡）
                if (newStreak >= 1) {
                    const bubble = document.createElement('div');
                    bubble.className = 'streak-bubble';
                    bubble.innerText = lang === 'zh' ? `🎉连续签到 ${newStreak} 天！` : `🎉 Streak: ${newStreak} days!`;
                    btn.appendChild(bubble);
                }

                setTimeout(() => {
                    alert(lang === 'zh' ? `🎉 签到成功！获得了 ${reward} 积分！` : `🎉 Success! You got ${reward} points!`);
                    location.reload();
                }, 1500); // 留一点时间看气泡动画
            } else {
                alert("Error: " + error.message);
                btn.disabled = false;
                btn.innerHTML = '📅 <span data-zh="每日签到" data-en="Check-in Now">' + (lang === 'zh' ? "每日签到" : "Check-in Now") + '</span>';
            }
        }

        // updatePassword 函数验证原密码正确性并更新为加密后的新密码
        async function updatePassword() {
            const oldRaw = document.getElementById('old-pwd').value;
            const newRaw = document.getElementById('new-pwd').value;
            const username = localStorage.getItem('username');

            if (!oldRaw || !newRaw) return alert(lang === 'zh' ? "请填写完整信息" : "Please fill all fields!");
            if (newRaw.length < 6) return alert(lang === 'zh' ? "新密码至少需要6位" : "New password too short!");

            const confirmMsg = lang === 'zh' ? "确定要修改密码吗？修改后将自动退出登录。" : "Sure to change password? This will logout you.";
            if (!confirm(confirmMsg)) return;

            const oldHash = await hashPassword(oldRaw);
            const { data } = await _supabase.from('users').select('password').eq('username', username).single();

            if (data.password !== oldHash) return alert(lang === 'zh' ? "原密码错误！" : "Wrong current password!");

            const newHash = await hashPassword(newRaw);
            const { error } = await _supabase.from('users').update({ password: newHash }).eq('username', username);

            if (!error) {
                alert(lang === 'zh' ? "修改成功！请重新登录。" : "Success! Please login again.");
                localStorage.clear();
                window.location.href = 'sign-in.html';
            } else {
                alert("Error: " + error.message);
            }
        }

        init();
    </script>
</body>

</html>
