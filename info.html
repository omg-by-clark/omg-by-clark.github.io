<!DOCTYPE html>
<!-- info.html -->
<html lang="zh-CN">

<head>
    <link href="logo.svg" rel="icon" type="image/svg+xml">
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0, user-scalable=no"
          name="viewport">
    <title>个人信息 Info - omg-by-Clark</title>
    <style>
        :root {
            --bg: #fffdf5;
            --text: #333;
            --brand: #ff4757;
            --card: #fff;
            --disabled: #bdc3c7;
            --checkin: linear-gradient(135deg, #fab387, #f9e2af);
        }

        body.dark {
            --bg: #121212;
            --text: #f1f2f6;
            --card: #1e1e1e;
            --disabled: #444;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            transition: background-color 0.3s;
        }

        .info-card {
            text-align: center;
            padding: 30px;
            width: 90%;
            max-width: 400px;
            background: var(--card);
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        /* 等级徽章 */
        .lv-badge {
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.85em;
            font-weight: bold;
            display: inline-block;
            margin-left: 8px;
            vertical-align: middle;
            position: relative;
        }

        .lv-log {
            background: #a1662f;
            color: white;
        }

        .lv-bronze {
            background: #cd7f32;
            color: white;
        }

        .lv-iron {
            background: #555555;
            color: white;
        }

        .lv-silver {
            background: #e0e0e0;
            color: #000;
        }

        .lv-gold {
            background: #ffd700;
            color: black;
        }

        .lv-diamond {
            background: #add8e6;
            color: #0000ff;
        }

        .lv-king {
            background: #ffd700;
            color: #ff8c00;
            padding-right: 18px;
        }

        .lv-king::after {
            content: "V";
            position: absolute;
            right: 4px;
            color: #ff8c00;
            font-weight: 900;
            font-style: italic;
        }

        .lv-epic {
            background: #a333c8;
            color: white;
            padding-right: 18px;
        }

        .lv-epic::after {
            content: "V";
            position: absolute;
            right: 4px;
            color: #e0b0ff;
            font-weight: 900;
            font-style: italic;
        }

        ul {
            list-style: none;
            padding: 0;
            line-height: 2.5;
            text-align: left;
            width: 100%;
            margin-bottom: 20px;
        }

        /* 签到按钮 */
        .btn-checkin {
            background: var(--checkin) !important;
            color: #1e1e2e;
            border: none;
            padding: 10px 24px;
            border-radius: 50px;
            cursor: pointer;
            width: auto;
            display: inline-block;
            font-size: 0.95em;
            font-weight: bold;
            margin: 10px 0 20px 0;
            box-shadow: 0 4px 12px rgba(250, 179, 135, 0.3);
            transition: transform 0.2s, filter 0.2s;
        }

        .btn-checkin:active {
            transform: scale(0.95);
        }

        .btn-checkin.disabled {
            background: var(--disabled);
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
            color: white;
        }

        .pwd-section {
            margin-top: 25px;
            border-top: 1px dashed #ccc;
            padding-top: 20px;
            text-align: left;
        }

        .pwd-input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            background: var(--bg);
            color: var(--text);
            outline: none;
        }

        .btn-update {
            background: var(--brand);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            margin-top: 12px;
            transition: transform 0.1s;
        }

        .btn-update:active {
            transform: scale(0.98);
        }

        .back-link {
            color: #888;
            text-decoration: none;
            font-weight: bold;
            margin-top: 25px;
            display: block;
            transition: transform 0.1s;
        }

        .back-link:active {
            transform: scale(1.1);
        }
    </style>
</head>

<body>
<div class="info-card">
    <h1 data-en="👤 User Info" data-zh="👤 个人信息">👤
        个人信息</h1>

    <ul id="info-list">
        <li id="u-name">👤 Loading...</li>
        <li id="u-points">💰 Points: 0</li>
        <li id="u-level">🥇 Level: <span
                class="lv-badge lv-log">...</span></li>
        <li id="u-last-check">📅 Last Check-in: -</li>
        <li id="u-check-count">🔢 Total Check-ins: 0</li>
    </ul>

    <button class="btn-checkin" id="btn-checkin"
            onclick="dailyCheckIn()">
        📅 <span data-en="Check-in Now" data-zh="每日签到">每日签到</span>
    </button>

    <div class="pwd-section">
        <button data-en="🔐 Change Password"
                data-zh="🔐 修改密码"
                onclick="togglePwdForm()"
                style="background:none; border:none; color:var(--brand); cursor:pointer; font-weight:bold;">🔐 修改密码
        </button>
        <div id="pwd-form"
             style="display:none; margin-top:10px;">
            <input class="pwd-input" data-en-ph="Current Password"
                   data-zh-ph="输入原密码" id="old-pwd"
                   type="password">
            <input class="pwd-input" data-en-ph="New Password (min 6)"
                   data-zh-ph="输入新密码 (至少6位)"
                   id="new-pwd"
                   type="password">
            <button class="btn-update"
                    data-en="Confirm Change"
                    data-zh="确认修改"
                    onclick="updatePassword()">确认修改
            </button>
        </div>
    </div>

    <a class="back-link" data-en="🏠 Back Home"
       data-zh="🏠 返回首页" href="index.html">
        🏠 返回首页
    </a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="db.js"></script>
<script>
    const lang = localStorage.getItem('lang') || 'zh';
    let currentPoints = 0;
    let currentCheckInCount = 0;

    // 安全增强：转义 HTML 字符，防止 <b>hi</b> 这种注入
    function escapeHTML(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    function getNickStyle(inventory) {
        if (!inventory) return '';
        const now = new Date();
        if (inventory['100'] && new Date(inventory['100']) > now) {
            return 'background: linear-gradient(to right, #d20f39, #fe640b, #df8e1d, #40a02b, #04a5e5, #8839ef); -webkit-background-clip: text; color: transparent; font-weight: bold;';
            return 'background: linear-gradient(to right, #d20f39, #fe640b, #df8e1d, #40a02b, #04a5e5, #8839ef); -webkit-background-clip: text; color: transparent; font-weight: bold;';
        }
        if (inventory['101'] && new Date(inventory['101']) > now) {
            return 'color: #04a5e5; font-weight: bold;';
        }
        if (inventory['102'] && new Date(inventory['102']) > now) {
            return 'color: #f9e2af; font-weight: bold; text-shadow: 0 0 5px rgba(250, 179, 135, 0.5);';
        }
        return '';
    }

    function togglePwdForm() {
        const f = document.getElementById('pwd-form');
        f.style.display = f.style.display === 'none' ? 'block' : 'none';
    }

    /**
     * 初始化：从 Supabase 读取积分、签到时间、次数及背包
     */
    async function init() {
        if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark');
        const user = localStorage.getItem('username');
        if (!user) {
            alert(localStorage.getItem('lang') === 'zh' ? '你还没有登录，请先登录再查看个人信息！' : 'You have not signed in yet, please sign in now!');
            window.location.href = 'sign-in.html';
            return;
        }

        // 1. 翻译逻辑
        document.querySelectorAll('[data-zh]').forEach(el => {
            el.innerText = lang === 'zh' ? el.getAttribute('data-zh') : el.getAttribute('data-en');
        });
        document.querySelectorAll('[data-zh-ph]').forEach(el => {
            el.placeholder = lang === 'zh' ? el.getAttribute('data-zh-ph') : el.getAttribute('data-en-ph');
        });

        // 2. 获取云端数据
        const {data} = await _supabase.from('users').select('*').eq('username', user).single();
        if (data) {
            currentPoints = data.points || 0;
            currentCheckInCount = data.check_in_count || 0;

            const lv = getLevelInfo(currentPoints);
            const nStyle = getNickStyle(data.inventory);
            const safeName = escapeHTML(data.username); // 安全转义

            // 渲染用户名 (带特效预览)
            document.getElementById('u-name').innerHTML = (lang === 'zh' ? "👤 用户名: " : "👤 Username: ") +
                `<span style="${nStyle}">${safeName}</span>`;

            document.getElementById('u-points').innerText = (lang === 'zh' ? "💰 积分: " : "💰 Points: ") + currentPoints;
            document.getElementById('u-level').innerHTML = (lang === 'zh' ? "🥇 等级: " : "🥇 Level: ") +
                `<span class="lv-badge ${lv.class}">${lv.name}</span>`;

            document.getElementById('u-check-count').innerText = (lang === 'zh' ? "🔢 签到次数: " : "🔢 Total Check-ins: ") + currentCheckInCount;

            // 3. 签到状态 (Timezone Aware)
            if (data.last_check_in) {
                const lastDateObj = new Date(data.last_check_in);
                const readableDate = lastDateObj.toLocaleDateString(lang === 'zh' ? 'zh-CN' : 'en-US');
                document.getElementById('u-last-check').innerText = (lang === 'zh' ? "📅 最后签到: " : "📅 Last Check-in: ") + readableDate;

                if (lastDateObj.toDateString() === new Date().toDateString()) {
                    const btn = document.getElementById('btn-checkin');
                    btn.classList.add('disabled');
                    btn.innerText = lang === 'zh' ? "✅ 今天已签到" : "✅ Checked In";
                    btn.disabled = true;
                }
            } else {
                document.getElementById('u-last-check').innerText = (lang === 'zh' ? "📅 最后签到: 暂无" : "📅 Last Check-in: None");
            }
        }
    }

    /**
     * 每日签到逻辑
     */
    async function dailyCheckIn() {
        const user = localStorage.getItem('username');
        const btn = document.getElementById('btn-checkin');
        if (btn.disabled) return;

        const reward = Math.floor(Math.random() * 10) + 1;
        const newPoints = currentPoints + reward;
        const newCheckInCount = currentCheckInCount + 1;
        const nowISO = new Date().toISOString();

        btn.innerText = "⏳ ...";

        const {error} = await _supabase.from('users').update({
            points: newPoints,
            last_check_in: nowISO,
            check_in_count: newCheckInCount
        }).eq('username', user);

        if (!error) {
            alert(lang === 'zh' ? `🎉 签到成功！获得了 ${reward} 积分！` : `🎉 Success! You got ${reward} points!`);
            location.reload();
        } else {
            alert("Error: " + error.message);
            btn.innerHTML = '📅 <span data-zh="每日签到" data-en="Check-in Now">' + (lang === 'zh' ? "每日签到" : "Check-in Now") + '</span>';
        }
    }

    async function updatePassword() {
        const oldRaw = document.getElementById('old-pwd').value;
        const newRaw = document.getElementById('new-pwd').value;
        const username = localStorage.getItem('username');

        if (!oldRaw || !newRaw) return alert(lang === 'zh' ? "请填写完整信息" : "Please fill all fields!");
        if (newRaw.length < 6) return alert(lang === 'zh' ? "新密码至少需要6位" : "New password too short!");

        const confirmMsg = lang === 'zh' ? "确定要修改密码吗？修改后将自动退出登录。" : "Sure to change password? This will logout you.";
        if (!confirm(confirmMsg)) return;

        const oldHash = await hashPassword(oldRaw);
        const {data} = await _supabase.from('users').select('password').eq('username', username).single();

        if (data.password !== oldHash) return alert(lang === 'zh' ? "原密码错误！" : "Wrong current password!");

        const newHash = await hashPassword(newRaw);
        const {error} = await _supabase.from('users').update({password: newHash}).eq('username', username);

        if (!error) {
            alert(lang === 'zh' ? "修改成功！请重新登录。" : "Success! Please login again.");
            localStorage.clear();
            window.location.href = 'sign-in.html';
        } else {
            alert("Error: " + error.message);
        }
    }

    init();
</script>
</body>

</html>
