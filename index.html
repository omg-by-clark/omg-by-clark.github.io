<!DOCTYPE html>
<!-- index.html -->
<html lang="zh-CN">

<head>
    <link href="logo.svg" rel="icon" type="image/svg+xml">
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>首页 Home • omg-by-Clark</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div class="header-container">
        <h1
            onclick="alert(document.localStorage.getItem('lang') === 'zh' ? '恭喜你看到了这个隐藏彩蛋！' : 'Congratulations on finding this hidden Easter egg!')">
            omg-by-Clark.github.io</h1>

        <div class="search-container">
            <input type="text" id="searchInput" placeholder="搜索帖子或输入 # 选择关键词" autocomplete="off">
            <div id="keywordDropdown" class="keyword-dropdown"></div>
            <div id="selectedKeywords" class="selected-keywords"></div>
        </div>

        <div class="header-actions">
            <div id="user-greeting" class="user-greeting"></div>

            <button class="btn-common" data-en="🤔 Random" data-zh="🤔 随机" onclick="goRandom()">
                🤔 随机
            </button>
            <a class="btn-common" data-en="🤬 Post Now" data-zh="🤬 发帖" href="post-now.html">
                🤬 发帖
            </a>
            <a id="btn-auth" class="btn-common" data-en="🔑 Sign In" data-zh="🔑 登录" href="sign-in.html">
                🔑 登录
            </a>
            <a href="info.html" class="btn-common" data-zh="👤 个人" data-en="👤 Info">
                👤 个人
            </a>
            <a class="btn-common" data-en="⚙️ Settings" data-zh="⚙️ 设置" href="settings.html">
                ⚙️ 设置
            </a>

        </div>
    </div>

    <div class="layout-container">
        <div class="col-all">
            <h2 class="section-title" data-en="📃 All Posts" data-zh="📃 全部帖子">
                📃 全部帖子
            </h2>
            <div id="list-all"></div>
            <div class="loading-sentinel" id="scroll-sentinel">
                <span></span><span></span><span></span>
            </div>
            <div class="end-message" data-en="🚫 No more posts" data-zh="😀 我也是有底线的！" id="end-message">😀 我也是有底线的！
            </div>
        </div>

        <div class="col-hot">
            <h2 class="section-title" data-en="🔥 Hot Top 5" data-zh="🔥 热搜 Top 5" style="color: var(--brand);">
                🔥 热搜 Top 5</h2>
            <div id="list-hot">
                <div class="loading-sentinel visible" style="height:100px;">
                    <span></span><span></span><span></span>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="db.js"></script>
    <script src="index.js"></script>
</body>

</html>
