<html lang="zh-CN">

<head>
        <!-- 本地数据同意脚本必须先于所有业务脚本加载。 -->
    <script src="../privacy.js"></script>
<link rel="icon" href="logo.svg" type="image/svg+xml">
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title data-zh="游玩游戏 • omg-by-Clark" data-en="Playing • omg-by-Clark">游玩游戏 • omg-by-Clark</title>
    <link rel="stylesheet" href="play.css">
</head>

<body>
    <header class="topbar"><a class="brand-link" href="index.html" aria-label="omg games">
            <img class="brand-logo" src="logo-longer.svg" alt="omg-by-Clark Games">
        </a>
        <div id="top-game-title" class="game-title" data-zh="读取游戏中..." data-en="Loading game...">读取游戏中...</div>
        <a class="btn-common btn-secondary" href="index.html" data-zh="🎮 游戏首页" data-en="🎮 Games home">🎮 游戏首页</a>
        <a class="btn-common" href="../index.html" data-zh="⬅️ 返回主站" data-en="⬅️ Main site">⬅️ 返回主站</a>
        <div class="user-chip" title="当前登录的 omg 账号" data-title-zh="当前登录的 omg 账号" data-title-en="Current omg account">
            <div id="user-avatar" class="user-avatar">?</div>
            <div id="user-name" class="user-name" data-zh="未登录" data-en="Not signed in">未登录</div>
        </div>
    </header>

    <main class="page">
        <div id="play-layout" class="play-layout hidden">
            <section id="player-card" class="player-card">
                <div class="player-head">
                    <div class="game-info">
                        <img id="game-icon" class="game-icon" src="logo.svg" alt="">
                        <div>
                            <h1 id="game-name" class="game-name" data-zh="读取游戏中..." data-en="Loading game...">读取游戏中...</h1>
                            <p id="game-meta" class="game-meta"></p>
                        </div>
                    </div>
                </div>
                <div class="frame-wrap">
                    <iframe id="game-frame" title="game" tabindex="0" allow="fullscreen; autoplay; gamepad"></iframe>
                    <div class="player-bar">
                        <button id="fullscreen-toggle" class="btn-common fullscreen-button" type="button" data-zh="🖥 全屏" data-en="🖥 Fullscreen">🖥 全屏</button>
                    </div>
                </div>
            </section>
            <aside class="side-panel" aria-label="side content">
                <section class="info-card">
                    <h2 id="info-title" data-zh="游戏介绍" data-en="About">游戏介绍</h2>
                    <p id="game-desc" data-zh="读取中..." data-en="Loading...">读取中...</p>
                    <h3 data-zh="操作方法" data-en="Controls">操作方法</h3>
                    <p id="game-controls" data-zh="读取中..." data-en="Loading...">读取中...</p>
                    <details id="more-details" class="more-details">
                        <summary data-zh="更多信息" data-en="More info">更多信息</summary>
                        <div class="details-content">
                            <div id="detail-list" class="detail-list"></div>
                            <a id="source-link" class="btn-common btn-secondary source-button hidden" href="#" target="_blank" rel="noopener noreferrer" data-zh="源代码 ↗" data-en="Source ↗">源代码 ↗</a>
                        </div>
                    </details>
                </section>
                <section class="play-next">
                    <h2 data-zh="接着玩" data-en="Play next">Play next</h2>
                    <div id="next-list" class="next-list"></div>
                    <p id="next-empty" class="next-empty hidden" data-zh="这个分类暂时没有别的游戏。" data-en="No other games in this category yet.">这个分类暂时没有别的游戏。</p>
                </section>
            </aside>
        </div>
        <p id="message" class="message" data-zh="读取游戏中..." data-en="Loading game...">读取游戏中...</p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../db.js"></script>
    <script src="game-db.js"></script>
    <script src="play.js"></script>
</body>

</html>
