<html lang="zh-CN">

<head>
    <script src="privacy.js"></script>
    <link href="logo.svg" rel="icon" type="image/svg+xml">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="omg-by-Clark 管理员页面">
    <title>管理员页面 Admin - omg-by-Clark</title>
    <link rel="stylesheet" href="theme.css">
    <script src="theme.js"></script>
    <style>
        :root {
            --bg: #fffdf5;
            --text: #2f2f2f;
            --card: #ffffff;
            --card-solid: #ffffff;
            --line: rgba(0, 0, 0, 0.1);
            --muted: #71717a;
            --brand-soft: rgba(255, 71, 87, 0.08);
            --shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
            --danger: #d94841;
            --warning: #e67700;
            --success: #2f9e44;
            --info: #2563eb;
        }

        body.dark {
            --bg: #171717;
            --text: #f2f2f2;
            --card: #1f1f1f;
            --card-solid: #262626;
            --line: rgba(255, 255, 255, 0.08);
            --muted: #aaaaaa;
            --brand-soft: rgba(255, 107, 129, 0.12);
            --shadow: 0 10px 28px rgba(0, 0, 0, 0.24);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Noto Sans SC', 'Source Han Sans SC', 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 20px 14px 56px;
            transition: background-color 0.3s, color 0.3s;
        }

        ::selection {
            background: rgba(255, 71, 87, 0.18);
        }

        .page-shell {
            max-width: 1120px;
            margin: 0 auto;
        }

        .panel {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 20px;
            box-shadow: var(--shadow);
        }

        .hero {
            padding: 22px;
        }

        .hero-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
            flex-wrap: wrap;
        }

        .hero-title {
            margin: 0;
            font-size: clamp(1.6rem, 3.5vw, 2.2rem);
            line-height: 1.15;
        }

        .hero-subtitle {
            margin: 10px 0 0;
            color: var(--muted);
            line-height: 1.65;
            max-width: 680px;
        }

        .hero-actions,
        .gate-actions,
        .modal-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-common,
        .btn-soft,
        .btn-danger,
        .btn-warning {
            border: 1px solid transparent;
            border-radius: 12px;
            padding: 10px 14px;
            cursor: pointer;
            font-size: 0.93rem;
            font-weight: 700;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transform-origin: center;
            will-change: transform;
            transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.18s, border-color 0.18s, color 0.18s, opacity 0.18s, filter 0.18s;
        }

        .btn-common {
            color: #fff;
            background: var(--brand);
        }

        .btn-soft {
            color: var(--text);
            background: var(--card-solid);
            border: 1px solid var(--line);
        }

        .btn-danger {
            color: #fff;
            background: var(--danger);
        }

        .btn-warning {
            color: #fff;
            background: var(--warning);
        }

        .btn-common:hover,
        .btn-soft:hover,
        .btn-danger:hover,
        .btn-warning:hover {
            filter: brightness(0.98);
        }

        .btn-common:active,
        .btn-soft:active,
        .btn-danger:active,
        .btn-warning:active {
            filter: brightness(0.94);
            transform: scale(1.08, 0.94);
        }

        .btn-common:disabled,
        .btn-soft:disabled,
        .btn-danger:disabled,
        .btn-warning:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            transform: none;
        }

        .summary-row {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 14px;
            margin-top: 16px;
        }

        .summary-card {
            background: var(--card-solid);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 16px;
        }

        .summary-label {
            font-size: 0.9rem;
            color: var(--muted);
        }

        .summary-value {
            margin-top: 8px;
            font-size: 1.45rem;
            font-weight: 800;
        }

        .gate,
        .section,
        .empty-card {
            margin-top: 16px;
            padding: 22px;
        }

        .gate {
            display: none;
        }

        .gate.visible {
            display: block;
        }

        .gate-title,
        .section-title,
        .modal-title {
            margin: 0;
            font-size: 1.25rem;
        }

        .gate-copy,
        .section-note,
        .modal-desc,
        .soft-note,
        .loading-card,
        .empty-card {
            color: var(--muted);
            line-height: 1.7;
        }

        .gate-copy {
            margin: 10px 0 0;
        }

        .gate-form {
            margin-top: 16px;
            max-width: 420px;
        }

        .field-label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.92rem;
            font-weight: 700;
        }

        .form-field,
        .form-select {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: var(--card-solid);
            color: var(--text);
            padding: 12px 14px;
            font-size: 0.96rem;
            outline: none;
        }

        .form-field:focus,
        .form-select:focus {
            border-color: var(--brand);
            box-shadow: 0 0 0 3px var(--brand-soft);
        }

        .gate-error {
            min-height: 24px;
            margin: 10px 0 0;
            color: var(--danger);
            font-size: 0.9rem;
            font-weight: 700;
        }

        .gate-status {
            margin-top: 12px;
            font-size: 0.9rem;
            color: var(--muted);
            white-space: pre-wrap;
            word-break: break-word;
        }

        .gate-actions {
            margin-top: 14px;
        }

        .section-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }

        .section-note {
            margin: 8px 0 0;
        }

        .admin-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }

        .admin-card {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            align-items: stretch;
            background: var(--card-solid);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 16px;
            min-width: 0;
        }

        .card-main {
            flex: 1;
            min-width: 0;
        }

        .card-title-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }

        .card-title {
            margin: 0;
            font-size: 1.04rem;
            line-height: 1.4;
        }

        .card-subtitle {
            margin: 0 0 12px;
            color: var(--muted);
            line-height: 1.65;
        }

        .meta-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px 14px;
        }

        .meta-item {
            min-width: 0;
        }

        .meta-label {
            display: block;
            margin-bottom: 4px;
            font-size: 0.78rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .meta-value {
            font-size: 0.95rem;
            font-weight: 700;
            min-width: 0;
        }

        .tag-list,
        .status-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tag-chip,
        .status-chip,
        .lv-badge,
        .mod-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border-radius: 999px;
            padding: 5px 10px;
            font-size: 0.78rem;
            font-weight: 700;
            white-space: nowrap;
        }

        .tag-chip {
            background: transparent;
            border: 1px solid var(--line);
            color: var(--text);
        }

        .tag-chip.repost {
            background: rgba(47, 158, 68, 0.1);
            border-color: rgba(47, 158, 68, 0.18);
            color: var(--success);
        }

        .status-chip.active-ban {
            background: rgba(217, 72, 65, 0.1);
            color: var(--danger);
        }

        .status-chip.expired-ban {
            background: rgba(47, 158, 68, 0.1);
            color: var(--success);
        }

        .status-chip.idle-status {
            background: rgba(37, 99, 235, 0.1);
            color: var(--info);
        }

        .lv-badge {
            color: #fff;
            background: #a1662f;
        }

        .lv-iron {
            background: #555;
        }

        .lv-bronze {
            background: #cd7f32;
        }

        .lv-silver {
            background: #e0e0e0;
            color: #222;
        }

        .lv-gold {
            background: #ffd700;
            color: #222;
        }

        .lv-diamond {
            background: #add8e6;
            color: #0b57d0;
        }

        .lv-king { background: #c98912; }
        .lv-epic { background: #7c3aed; }

        .mod-badge {
            background: rgba(124, 58, 237, 0.1);
            color: #7c3aed;
            border: 1px solid rgba(124, 58, 237, 0.14);
        }

        .card-actions {
            width: 168px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-shrink: 0;
        }

        .card-actions .btn-common,
        .card-actions .btn-soft,
        .card-actions .btn-danger,
        .card-actions .btn-warning {
            width: 100%;
        }

        .card-meta {
            margin-top: 12px;
            font-size: 0.84rem;
            color: var(--muted);
        }

        .loading-card,
        .empty-card {
            background: var(--card-solid);
            border: 1px dashed var(--line);
            border-radius: 16px;
            text-align: center;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.42);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 999;
            backdrop-filter: blur(4px);
        }

        .modal-overlay[hidden] {
            display: none;
        }

        .modal-card {
            width: min(100%, 460px);
            background: var(--card-solid);
            border: 1px solid var(--line);
            border-radius: 18px;
            box-shadow: var(--shadow);
            padding: 20px;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 36px;
            height: 36px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: transparent;
            color: var(--text);
            cursor: pointer;
            transform-origin: center;
            transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.18s, border-color 0.18s;
        }

        .close-btn:active {
            transform: scale(1.08, 0.94);
        }

        .modal-desc {
            margin: 10px 0 0;
        }

        .modal-body {
            margin-top: 16px;
        }

        .form-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .switch-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            border: 1px solid var(--line);
            border-radius: 14px;
            margin-bottom: 14px;
            background: var(--card-solid);
        }

        .switch-title {
            font-weight: 800;
        }

        .switch-desc {
            margin-top: 4px;
            color: var(--muted);
            font-size: 0.88rem;
            line-height: 1.55;
        }

        .switch {
            position: relative;
            width: 54px;
            height: 30px;
            flex-shrink: 0;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            inset: 0;
            border-radius: 999px;
            background: rgba(127, 127, 127, 0.34);
            cursor: pointer;
            transition: 0.2s;
        }

        .slider::before {
            content: "";
            position: absolute;
            top: 4px;
            left: 4px;
            width: 22px;
            height: 22px;
            border-radius: 999px;
            background: #fff;
            transition: 0.2s;
        }

        .switch input:checked + .slider {
            background: var(--brand);
        }

        .switch input:checked + .slider::before {
            transform: translateX(24px);
        }

        .toast-region {
            position: fixed;
            right: 16px;
            bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 1000;
            pointer-events: none;
        }

        .toast {
            min-width: 220px;
            max-width: 340px;
            border-radius: 14px;
            padding: 12px 14px;
            color: #fff;
            box-shadow: var(--shadow);
            font-size: 0.92rem;
            line-height: 1.5;
            animation: toast-in 0.2s ease;
        }

        .toast.success {
            background: var(--success);
        }

        .toast.error {
            background: var(--danger);
        }

        .toast.info {
            background: var(--info);
        }

        @keyframes toast-in {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 960px) {
            .summary-row,
            .admin-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 720px) {
            body {
                padding: 14px 10px 48px;
            }

            .hero,
            .gate,
            .section,
            .empty-card {
                padding: 18px;
                border-radius: 18px;
            }

            .admin-card {
                flex-direction: column;
            }

            .card-actions {
                width: 100%;
            }

            .meta-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="page-shell">
        <section class="panel hero">
            <div class="hero-top">
                <div>
                    <h1 class="hero-title" data-zh="管理员页面" data-en="Admin Console">管理员页面</h1>
                </div>
                <div class="hero-actions">
                    <a class="btn-soft" href="index.html" data-zh="返回首页" data-en="Back Home">返回首页</a>
                    <button class="btn-soft" id="btn-refresh" type="button" data-zh="刷新数据" data-en="Refresh Data">刷新数据</button>
                    <button class="btn-common" id="btn-jump-users" type="button" data-zh="跳到用户管理" data-en="Jump to Users">跳到用户管理</button>
                </div>
            </div>

            <div class="summary-row">
                <div class="summary-card">
                    <div class="summary-label" data-zh="帖子总数" data-en="Total Posts">帖子总数</div>
                    <div class="summary-value" id="summary-posts">-</div>
                </div>
                <div class="summary-card">
                    <div class="summary-label" data-zh="用户总数" data-en="Total Users">用户总数</div>
                    <div class="summary-value" id="summary-users">-</div>
                </div>
                <div class="summary-card">
                    <div class="summary-label" data-zh="当前管理员" data-en="Current Admin">当前管理员</div>
                    <div class="summary-value" id="summary-admin">-</div>
                </div>
            </div>
        </section>

        <section class="panel gate" id="auth-gate">
            <h2 class="gate-title" data-zh="管理员验证" data-en="Admin Verification">管理员验证</h2>
            <p class="gate-copy" id="auth-copy" data-zh="正在检查数据库里的管理员身份。" data-en="Checking your admin flag in the database.">正在检查数据库里的管理员身份。</p>
            <div class="gate-form" id="auth-form" hidden>
                <label class="field-label" for="admin-password" data-zh="再次输入密码" data-en="Enter your password again">再次输入密码</label>
                <input class="form-field" id="admin-password" type="password" autocomplete="current-password" data-zh-ph="输入当前密码" data-en-ph="Enter your current password" placeholder="输入当前密码">
                <div class="gate-error" id="auth-error"></div>
                <div class="gate-actions">
                    <button class="btn-common" id="btn-admin-auth" type="button" data-zh="进入管理员界面" data-en="Enter Admin Console">进入管理员界面</button>
                    <a class="btn-soft" href="index.html" data-zh="返回首页" data-en="Back Home">返回首页</a>
                </div>
            </div>
            <div class="gate-status" id="auth-status"></div>
        </section>

        <main id="admin-main" hidden>
            <section class="panel section">
                <div class="section-header">
                    <div>
                        <h2 class="section-title" data-zh="帖子管理" data-en="Post Management">帖子管理</h2>
                        <p class="section-note" data-zh="可以删除帖子，或者给帖子追加“疑似搬运”标签。" data-en="Delete posts or append the suspected repost tag.">可以删除帖子，或者给帖子追加“疑似搬运”标签。</p>
                    </div>
                </div>
                <div class="admin-grid" id="post-grid">
                    <div class="loading-card">Loading...</div>
                </div>
            </section>

            <section class="panel section" id="user-management">
                <div class="section-header">
                    <div>
                        <h2 class="section-title" data-zh="用户管理" data-en="User Management">用户管理</h2>
                        <p class="section-note" data-zh="可以删用户、封禁、扣分，或者同步修改用户名。" data-en="Delete users, ban them, deduct points, or rename them with sync.">可以删用户、封禁、扣分，或者同步修改用户名。</p>
                    </div>
                </div>
                <div class="admin-grid" id="user-grid">
                    <div class="loading-card">Loading...</div>
                </div>
            </section>
        </main>
    </div>

    <div class="modal-overlay" id="modal-overlay" hidden>
        <div class="modal-card" aria-modal="true" aria-labelledby="modal-title" role="dialog">
            <button class="close-btn" id="modal-close" type="button" aria-label="Close">×</button>
            <h3 class="modal-title" id="modal-title"></h3>
            <p class="modal-desc" id="modal-desc"></p>
            <div class="modal-body" id="modal-body"></div>
            <div class="modal-actions">
                <button class="btn-soft" id="modal-cancel" type="button"></button>
                <button class="btn-common" id="modal-confirm" type="button"></button>
            </div>
        </div>
    </div>

    <div class="toast-region" id="toast-region" aria-live="polite"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="db.js"></script>
    <script src="admin.js"></script>
</body>

</html>
