<!DOCTYPE html>
<!-- 升级中的 index.html -->
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>升级中 Updating • omg-by-Clark</title>
    <style>
        :root {
            --bg: #fffdf5;
            /* 修改背景颜色为 #fffdf5 */
            --brand: #ff6b81;
        }

        body {
            background-color: var(--bg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            text-align: center;
        }

        .main-title {
            font-family: Consolas, Monaco, monospace;
            color: var(--brand);
            padding: 15px 30px;
            border: 4px solid var(--brand);
            display: inline-block;
            border-radius: 15px;
            box-shadow: 6px 6px 0px var(--brand);
            background-color: white;
            margin-bottom: 30px;
            font-size: 2.2rem;
        }

        .sub-title {
            color: #333333;
            font-size: 1.2rem;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1 class="main-title">omg-by-Clark.github.io</h1>

    <div class="sub-title">🕒 升级中 Updating</div>

</body>

</html>
