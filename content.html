<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <link href="logo.svg" rel="icon" type="image/svg+xml">
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0"
          name="viewport">
    <title>详情 Details - omg-by-Clark</title>
    <style>
        :root {
            --bg: #fffdf5;
            --text: #333;
            --brand: #ff4757;
            --card: #fff;
            --unliked: #bbb;
            --disliked: #57606f;
            --kw-text: hsl(22deg, 99%, 52%);

            /* 投票胶囊颜色变量 - 浅色模式 */
            --vote-bg-neutral: hsl(233deg, 10%, 47%);
            --vote-bg-liked: #ff4757;
            --vote-bg-disliked: #7287fd;
        }

        body.dark {
            --bg: #1a1a1a;
            --text: #f0f0f0;
            --brand: #ff6b81;
            --card: #2d2d2d;
            --unliked: hsl(227deg, 12%, 60%);
            --disliked: #a4b0be;

            /* 投票胶囊颜色变量 - 深色模式 */
            --vote-bg-neutral: #333;
            --vote-bg-liked: #ff6b81;
            --vote-bg-disliked: #7287fd;
        }

        body {
            font-family: sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 30px 20px;
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
            transition: 0.3s;
        }

        h1 {
            color: var(--brand);
            font-size: 1.8rem;
            margin-bottom: 20px;
        }

        .kw-row {
            color: var(--kw-text);
            font-weight: bold;
            font-size: 1em;
            margin-bottom: 20px;
            display: block;
        }

        #c {
            white-space: pre-wrap;
            font-size: 1.1em;
            background: var(--card);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            min-height: 120px;
            margin-bottom: 30px;
        }

        .action-area {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
        }

        /* 详情页的胶囊样式
           Logic Change: 背景常驻中立色
        */
        .vote-pill {
            display: flex;
            align-items: center;
            background-color: var(--vote-bg-neutral);
            border-radius: 30px; /* 更圆润 */
            padding: 2px; /* 减小内边距 */
            transition: background-color 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        /* 删除了 .vote-pill.is-liked 背景变化
           新增子元素变化逻辑
        */

        .vote-pill.is-liked .like-btn {
            background-color: var(--vote-bg-liked);
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4); /* 给激活的按钮一点光晕 */
        }

        .vote-pill.is-disliked .dislike-btn {
            background-color: var(--vote-bg-disliked);
        }

        .like-btn,
        .dislike-btn {
            background: transparent;
            border: none;
            color: white;
            padding: 10px 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1em;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            border-radius: 28px; /* 适应父容器 */
        }

        .vote-divider {
            width: 1px;
            height: 24px;
            background-color: rgba(255, 255, 255, 0.3);
            margin: 0 5px;
            transition: opacity 0.2s;
        }

        /* 激活时隐藏分割线 */
        .vote-pill.is-liked .vote-divider,
        .vote-pill.is-disliked .vote-divider {
            opacity: 0.2;
        }

        /* 简单的点击动画 */
        .like-btn:active, .dislike-btn:active {
            transform: scale(0.9);
        }

        .cmt-box {
            margin-top: 20px;
            border-top: 2px solid var(--brand);
            padding-top: 25px;
        }

        .cmt-item {
            background: rgba(128, 128, 128, 0.08);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        input {
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #ddd;
            background: var(--card);
            color: var(--text);
            flex: 1;
            outline: none;
        }

        .btn-send {
            background: var(--brand);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s;
        }

        /* OP 专属徽章样式，大小对齐等级标志 */
        .op-badge {
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.75em;
            font-weight: bold;
            margin-left: 5px;
            display: inline-block;
            background-color: #1e66f5; /* 浅色模式背景 */
            color: #89dceb; /* 浅色模式文字 */
        }

        /* 深色模式下的 OP 徽章颜色反转 */
        body.dark .op-badge {
            background-color: #89dceb;
            color: #1e66f5;
        }

        .lv-badge {
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.75em;
            font-weight: bold;
            margin-left: 5px;
            display: inline-block;
        }

        .lv-log {
            background: #8b5a2b;
            color: white;
        }

        .lv-iron {
            background: #4a4a4a;
            color: white;
        }

        .lv-bronze {
            background: #cd7f32;
            color: white;
        }

        .lv-silver {
            background: #e0e0e0;
            color: #333;
        }

        .lv-gold {
            background: #ffd700;
            color: #856404;
        }

        .lv-diamond {
            background: #b9f2ff;
            color: #007bff;
        }

        .lv-king {
            background: linear-gradient(45deg, #ffd700, #ffaa00);
            color: #fff;
            padding-right: 18px;
        }

        .lv-king::after {
            content: "V";
            position: absolute;
            right: 4px;
            font-style: italic;
            font-weight: 900;
        }

        .lv-epic {
            background: linear-gradient(45deg, #a333c8, #6d28d9);
            color: white;
            padding-right: 18px;
        }

        .lv-epic::after {
            content: "V";
            position: absolute;
            right: 4px;
            font-style: italic;
            font-weight: 900;
        }

        .nav-links {
            margin-top: 40px;
            display: flex;
            gap: 25px;
            justify-content: center;
        }

        .nav-links a {
            text-decoration: none;
            font-weight: bold;
            font-size: 1.05rem;
        }
    </style>
</head>

<body>
<h1 id="t">...</h1>
<div id="info"
     style="color:#888; font-size:0.9em; margin-bottom:10px; border-bottom:1px solid #eee; padding-bottom:10px;"></div>
<div class="kw-row" id="kw-row"></div>
<div id="c">Loading...</div>

<div class="action-area">
    <div class="vote-pill" id="vote-container">
        <button class="like-btn" id="btn-like"
                onclick="toggleDetailVote('like')">
            👍 <span id="like-count">0</span>
        </button>
        <div class="vote-divider"></div>
        <button class="dislike-btn" id="btn-dislike"
                onclick="toggleDetailVote('dislike')">
            👎 <span id="dislike-count">0</span>
        </button>
    </div>
</div>

<div class="cmt-box">
    <h3 data-en="💬 Comments" data-zh="💬 评论区">💬
        评论区</h3>
    <div id="cmt-list"></div>
    <div style="margin-top:25px; display:flex; gap:12px;">
        <input data-en-ph="Write a cool comment..."
               data-zh-ph="神评由此诞生..."
               id="cC"
               style="flex:1"
               type="text">
        <button class="btn-send" data-en="Send"
                data-zh="发送" onclick="addCmt()">发送
        </button>
    </div>
</div>

<div class="nav-links">
    <a data-en="⬅️ Back to Plaza" data-zh="⬅️ 返回广场"
       href="index.html" style="color:var(--brand);">
        ⬅️ 返回广场
    </a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="db.js"></script>
<script>
    const lang = localStorage.getItem('lang') || 'zh';
    if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark');
    document.querySelectorAll('[data-zh]').forEach(el => {
        el.innerText = (lang === 'zh' ? el.getAttribute('data-zh') : el.getAttribute('data-en'));
    });
    document.querySelectorAll('[data-zh-ph]').forEach(el => {
        el.placeholder = (lang === 'zh' ? el.getAttribute('data-zh-ph') : el.getAttribute('data-en-ph'));
    });
</script>
<script src="content.js"></script>
</body>

</html>
