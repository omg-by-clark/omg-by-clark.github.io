<!DOCTYPE html>
<!-- content.html -->
<html lang="zh-CN">

<head>
    <link href="logo.svg" rel="icon" type="image/svg+xml">
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>详情 Details • omg-by-Clark</title>
    <style>
        /* :root 用途：定义浅色模式下的全局基础颜色变量，包括背景、文字、品牌色以及状态色。 */
        :root {
            --bg: #fffdf5;
            --text: #333;
            --brand: #ff4757;
            --card: #fff;
            --unliked: #bbb;
            --disliked: #57606f;
            --kw-text: #5c5f77;
            --vote-bg-neutral: hsl(233deg, 10%, 47%);
            --vote-bg-disliked: #7287fd;
            --delete-btn: #d20f14;
            --nsfw-color: #fe640b;
            --repost-color: #40a02b;
        }
        /* body.dark 用途：定义深色模式下的颜色变量覆盖，实现页面的暗黑模式自适应。 */
        body.dark {
            --bg: #1a1a1a;
            --text: #f0f0f0;
            --brand: #ff6b81;
            --card: #2d2d2d;
            --unliked: hsl(227deg, 12%, 60%);
            --disliked: #a4b0be;
            --kw-text: #838ba7;
            --vote-bg-neutral: #333;
            --vote-bg-disliked: #7287fd;
            --delete-btn: #f02832;
            --repost-color: #a6e3a1;
        }
        /* selection 用途：设置用户选择时的字体颜色 */
        ::selection {
            background: hsla(355, 100%, 75%, 0.3);
        }
        /* body 途：设置页面整体的字体、最大宽度、居中对齐、内外边距及换肤的过渡动画。 */
        body {
            font-family: sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 30px 20px;
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
            transition: 0.3s;
            overflow-wrap: break-word;
            word-break: break-word;
        }

        /* h1 用途：设置详情页主标题的颜色、大小及底部外边距。 */
        h1 {
            color: var(--brand);
            font-size: 1.8rem;
            margin-bottom: 20px;
        }

        /* .kw-row 用途：设置关键词所在行的文字颜色、加粗样式及间距。 */
        .kw-row {
            color: var(--kw-text);
            font-weight: bold;
            font-size: 1em;
            margin-bottom: 20px;
            display: block;
        }

        /* #c 用途：设置帖子正文内容区域的背景卡片、圆角、阴影、预格式化换行及字号。 */
        #c {
            white-space: pre-wrap;
            font-size: 1.1em;
            background: var(--card);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            min-height: 120px;
            margin-bottom: 30px;
            /* 新增：配合 pre-wrap 使用，允许无空格的长字符串强行打断，不至于撑破卡片 */
            overflow-wrap: break-word;
            word-break: break-word;
        }

        /* .action-area 用途：使用 Flexbox 居中排列详情页的交互操作按钮区域。 */
        .action-area {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
        }

        /* .vote-pill 用途：设置包含点赞/踩按钮的药丸形容器的基础样式、背景色及阴影。 */
        .vote-pill {
            display: flex;
            align-items: center;
            background-color: var(--vote-bg-neutral);
            border-radius: 30px;
            padding: 2px;
            transition: background-color 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        /* .vote-pill.is-liked .like-btn 用途：当帖子被点赞时，使点赞按钮呈现高亮色及光晕阴影。 */
        .vote-pill.is-liked .like-btn {
            background-color: var(--brand);
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
        }

        /* .vote-pill.is-disliked .dislike-btn 用途：当帖子被点踩时，使点踩按钮呈现对应的深色。 */
        .vote-pill.is-disliked .dislike-btn {
            background-color: var(--vote-bg-disliked);
        }

        /* .like-btn, .dislike-btn 用途：设置独立的赞/踩按钮的透明背景、边距、圆角和基础文字排版。 */
        .like-btn,
        .dislike-btn {
            background: transparent;
            border: none;
            color: white;
            padding: 10px 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1em;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            border-radius: 28px;
        }

        /* .like-btn:disabled, .dislike-btn:disabled 用途：如果没有加载出来，投票按钮变色并且不能点击。 */
        .like-btn:disabled,
        .dislike-btn:disabled {
            background-color: hsl(233deg, 10%, 47%);
            color: hsl(220deg, 21%, 89%);
            cursor: not-allowed;
            transform: none !important;
        }

        /* .vote-divider 用途：在点赞和点踩按钮之间绘制一条半透明的垂直分割线。 */
        .vote-divider {
            width: 1px;
            height: 24px;
            background-color: rgba(255, 255, 255, 0.3);
            margin: 0 5px;
            transition: opacity 0.2s;
        }

        /* .vote-pill.is-liked .vote-divider, .vote-pill.is-disliked .vote-divider 用途：投票激活状态下，降低中间分割线的透明度使其融入背景。 */
        .vote-pill.is-liked .vote-divider,
        .vote-pill.is-disliked .vote-divider {
            opacity: 0.2;
        }

        /* .like-btn:active, .dislike-btn:active 用途：点击按钮时放大元素的缩放比例，提供统一的1.1倍点击特效。 */
        .like-btn:active,
        .dislike-btn:active {
            transform: scale(1.1);
        }

        /* .cmt-box 用途：评论区外层容器，设置顶部边框线及与上方内容的间距。 */
        .cmt-box {
            margin-top: 20px;
            border-top: 2px solid var(--brand);
            padding-top: 25px;
        }

        /* .cmt-item 用途：单条评论的卡片样式，包含灰色半透明背景、圆角及 Flex 排版。 */
        .cmt-item {
            background: rgba(128, 128, 128, 0.08);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            overflow-wrap: break-word;
            word-break: break-word;
        }

        /* .cmt-content 用途：确保评论文本区在 Flex 容器中可以被正确压缩并允许长文本换行，防止挤出屏幕外。 */
        .cmt-content {
            flex: 1;
            min-width: 0;
        }

        /* input 用途：设置评论输入框的边框、背景、字体颜色和圆角。 */
        input {
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #ddd;
            background: var(--card);
            color: var(--text);
            flex: 1;
            outline: none;
        }

        /* .btn-send 用途：设置发送评论按钮的主题色背景、文字颜色和圆角等样式，参考 post-now 的设计。 */
        .btn-send {
            background: var(--brand);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1em;
            transition: 0.1s;
        }

        .btn-send:disabled {
            background-color: #ccc;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-send:active:not(:disabled) {
            transform: scale(1.1);
        }

        /* .op-badge 用途：为发帖人在评论区的名字旁添加专属的蓝色 OP 徽章标识。 */
        .op-badge {
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 1em;
            font-weight: bold;
            margin-left: 5px;
            display: inline-block;
            color: #1e66f5;
        }

        /* body.dark .op-badge 用途：深色模式下自动反转 OP 徽章为较亮的浅蓝色。 */
        body.dark .op-badge {
            color: #54cdfc;
        }

        /* .lv-badge 用途：所有用户等级徽章的基础排版样式，包含边距、字号和圆角。 */
        .lv-badge {
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.75em;
            font-weight: bold;
            margin-left: 5px;
            display: inline-block;
            position: relative;
        }

        /* .lv-log 用途：定义等级“原木”的背景和字体配色。 */
        .lv-log {
            background: #8b5a2b;
            color: white;
        }

        /* .lv-iron 用途：定义等级“黑铁”的背景和字体配色。 */
        .lv-iron {
            background: #4a4a4a;
            color: white;
        }

        /* .lv-bronze 用途：定义等级“青铜”的背景和字体配色。 */
        .lv-bronze {
            background: #cd7f32;
            color: white;
        }

        /* .lv-silver 用途：定义等级“白银”的背景和字体配色。 */
        .lv-silver {
            background: #e0e0e0;
            color: #333;
        }

        /* .lv-gold 用途：定义等级“黄金”的背景和字体配色。 */
        .lv-gold {
            background: #ffd700;
            color: #856404;
        }

        /* .lv-diamond 用途：定义等级“钻石”的背景和字体配色。 */
        .lv-diamond {
            background: #b9f2ff;
            color: #007bff;
        }

        /* .lv-king 用途：定义等级“王者”的渐变背景色及内部右边距预留。 */
        .lv-king {
            background: linear-gradient(45deg, #ffd700, #ffaa00);
            color: #fff;
            padding-right: 18px;
        }

        /* .lv-king::after 用途：利用伪元素在王者徽章右侧添加斜体字母 V 装饰。 */
        .lv-king::after {
            content: "V";
            position: absolute;
            right: 4px;
            font-style: italic;
            font-weight: 900;
        }

        /* .lv-epic 用途：定义等级“史诗”的渐变紫背景及内部右边距预留。 */
        .lv-epic {
            background: linear-gradient(45deg, #a333c8, #6d28d9);
            color: white;
            padding-right: 18px;
        }

        /* .lv-epic::after 用途：利用伪元素在史诗徽章右侧添加斜体字母 V 装饰。 */
        .lv-epic::after {
            content: "V";
            position: absolute;
            right: 4px;
            font-style: italic;
            font-weight: 900;
        }

        /* .nav-links 用途：页面底部导航区域，让返回链接和删除按钮水平居中对齐。 */
        .nav-links {
            margin-top: 40px;
            display: flex;
            gap: 25px;
            justify-content: center;
            align-items: center;
        }

        /* .nav-links a 用途：取消底部链接的下划线并加粗文字。 */
        .nav-links a {
            text-decoration: none;
            font-weight: bold;
            font-size: 1.05rem;
            display: inline-block;
            transition: 0.1s;
        }

        /* .nav-links a:active 用途：返回首页按钮也要像发布评论一样有点击放大的效果。 */
        .nav-links a:active {
            transform: scale(1.1);
        }

        /* .btn-delete-post 用途：设置删除帖子按钮的红色样式，默认隐藏。 */
        .btn-delete-post {
            background-color: var(--delete-btn);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            display: none;
        }

        /* .btn-delete-post:active 用途：设置删除帖子按钮点击时的放大动效反馈。 */
        .btn-delete-post:active {
            transform: scale(1.1);
        }

        /* .blur-content 用途：给带有 NSFW 标签的文本施加高斯模糊滤镜，防止直接查看。 */
        .blur-content {
            filter: blur(3.5px);
            user-select: none;
            transition: filter 0.3s ease;
        }

        /* .revealed-content 用途：取消文本的高斯模糊状态，使其正常显示并允许选中文本。 */
        .revealed-content {
            filter: blur(0);
            user-select: auto;
        }

        /* .nsfw-tag 用途：对 NSFW 关键词进行强样式覆盖，呈现下划线粗体橙色。 */
        .nsfw-tag {
            color: var(--nsfw-color) !important;
            font-weight: 900 !important;
            font-size: 1.2em !important;
            text-decoration: underline 1px solid var(--nsfw-color) !important;
            cursor: pointer;
        }

        /* .repost-tag 用途：对搬运类关键词进行加粗变绿的强样式覆盖。 */
        .repost-tag {
            color: var(--repost-color) !important;
            font-weight: bold !important;
        }
    </style>
</head>

<body>
<h1 id="t">...</h1>
<div id="info"
     style="color:#888; font-size:0.9em; margin-bottom:10px; border-bottom:1px solid #eee; padding-bottom:10px;">
</div>
<div class="kw-row" id="kw-row"></div>
<div id="c">Loading...</div>

<div class="action-area">
    <div class="vote-pill" id="vote-container">
        <button class="like-btn" id="btn-like" onclick="toggleDetailVote('like')" disabled>
            👍 <span id="like-count">0</span>
        </button>
        <div class="vote-divider"></div>
        <button class="dislike-btn" id="btn-dislike" onclick="toggleDetailVote('dislike')" disabled>
            👎 <span id="dislike-count">0</span>
        </button>
    </div>
</div>

<div class="cmt-box">
    <h3 data-en="💬 Comments" data-zh="💬 评论区">💬
        评论区</h3>
    <div id="cmt-list"></div>
    <div style="margin-top:25px; display:flex; gap:12px;">
        <input data-en-ph="Write a cool comment..." data-zh-ph="神评由此诞生..." id="cC" style="flex:1" type="text">
        <button class="btn-send" data-en="Send" data-zh="发送" onclick="addCmt()">发送
        </button>
    </div>
</div>

<div class="nav-links">
    <a data-en="⬅️ Back to Plaza" data-zh="⬅️ 返回广场" href="index.html" style="color:var(--brand);">
        ⬅️ 返回广场
    </a>

    <button id="btn-delete-post" class="btn-delete-post" onclick="deletePost()" data-en="🗑️ Delete"
            data-zh="🗑️ 删除帖子">
        🗑️ 删除帖子
    </button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="db.js"></script>
<script>
    const lang = localStorage.getItem('lang') || 'zh';
    if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark');
    document.querySelectorAll('[data-zh]').forEach(el => {
        el.innerText = (lang === 'zh' ? el.getAttribute('data-zh') : el.getAttribute('data-en'));
    });
    document.querySelectorAll('[data-zh-ph]').forEach(el => {
        el.placeholder = (lang === 'zh' ? el.getAttribute('data-zh-ph') : el.getAttribute('data-en-ph'));
    });
</script>
<script src="content.js"></script>
</body>

</html>
