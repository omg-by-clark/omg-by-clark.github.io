<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>详情 Details - omg-by-Clark</title>
    <style>
        :root {
            --bg: #fffdf5;
            --text: #333;
            --brand: #ff4757;
            --card: #fff;
        }

        body.dark {
            --bg: #1a1a1a;
            --text: #f0f0f0;
            --brand: #ff6b81;
            --card: #2d2d2d;
        }

        body {
            font-family: sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 30px 20px;
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
            transition: 0.3s;
        }

        h1 {
            color: var(--brand);
            font-size: 1.8rem;
            margin-bottom: 20px;
        }

        #c {
            white-space: pre-wrap;
            font-size: 1.1em;
            background: var(--card);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            min-height: 120px;
            margin-bottom: 30px;
        }

        /* 评论区样式 */
        .cmt-box {
            margin-top: 50px;
            border-top: 2px solid var(--brand);
            padding-top: 25px;
        }

        .cmt-item {
            background: rgba(128, 128, 128, 0.08);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        input {
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #ddd;
            background: var(--card);
            color: var(--text);
            flex: 1;
            outline: none;
        }

        .btn-send {
            background: var(--brand);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s;
        }

        .btn-send:active {
            transform: scale(1.1);
        }

        /* === 🏆 等级勋章 - 真正全量补完版 === */
        .lv-badge {
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.75em;
            font-weight: bold;
            margin-left: 5px;
            vertical-align: middle;
            position: relative;
            display: inline-block;
        }

        .lv-log { background: #8b5a2b; color: white; } /* 原木 */
        .lv-iron { background: #4a4a4a; color: white; } /* 黑铁 */
        .lv-bronze { background: #cd7f32; color: white; } /* 青铜 (补回) */
        .lv-silver { background: #e0e0e0; color: #333; } /* 白银 */
        .lv-gold { background: #ffd700; color: #856404; } /* 黄金 */
        .lv-diamond { background: #b9f2ff; color: #007bff; } /* 钻石 */
        
        .lv-king { /* 王者 */
            background: linear-gradient(45deg, #ffd700, #ffaa00);
            color: #fff; padding-right: 18px;
        }
        .lv-king::after { content: "V"; position: absolute; right: 4px; font-style: italic; font-weight: 900; }

        .lv-epic { /* 史诗 */
            background: linear-gradient(45deg, #a333c8, #6d28d9);
            color: white; padding-right: 18px;
        }
        .lv-epic::after { content: "V"; position: absolute; right: 4px; font-style: italic; font-weight: 900; }

        .nav-links {
            margin-top: 40px;
            display: flex;
            gap: 25px;
            justify-content: center;
        }

        .nav-links a {
            text-decoration: none;
            font-weight: bold;
            font-size: 1.05rem;
        }
    </style>
</head>

<body>
    <h1 id="t">...</h1>
    <div id="info" style="color:#888; font-size:0.9em; margin-bottom:20px; border-bottom:1px solid #eee; padding-bottom:10px;">
    </div>

    <div id="c">Loading...</div>

    <div class="cmt-box">
        <h3 data-zh="💬 评论区" data-en="💬 Comments">💬 评论区</h3>
        <div id="cmt-list"></div>

        <div style="margin-top:25px; display:flex; gap:12px;">
            <input type="text" id="cC" data-zh-ph="神评由此诞生..." data-en-ph="Write a cool comment..." style="flex:1">
            <button onclick="addCmt()" class="btn-send" data-zh="发送" data-en="Send">发送</button>
        </div>
    </div>

    <div class="nav-links">
        <a href="othersPost.html" style="color:var(--brand);" data-zh="⬅️ 返回广场" data-en="⬅️ Back to Plaza">⬅️ 返回广场</a>
        <a href="home.html" style="color:#888;" data-zh="🏠 返回首页" data-en="🏠 Back Home">🏠 返回首页</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="db.js"></script>
    <script>
        // 初始化语言与主题渲染 [cite: 2026-01-25]
        const lang = localStorage.getItem('lang') || 'zh';
        if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark');

        document.querySelectorAll('[data-zh]').forEach(el => {
            el.innerText = (lang === 'zh' ? el.getAttribute('data-zh') : el.getAttribute('data-en'));
        });
        document.querySelectorAll('[data-zh-ph]').forEach(el => {
            el.placeholder = (lang === 'zh' ? el.getAttribute('data-zh-ph') : el.getAttribute('data-en-ph'));
        });
    </script>
    <script src="content.js"></script>
</body>

</html>
