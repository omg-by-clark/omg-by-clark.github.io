<!DOCTYPE html>
<!-- content.html -->
<html lang="zh-CN">

<head>
    <link rel="icon" href="logo.svg" type="image/svg+xml">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>详情 Details - omg-by-Clark</title>
    <style>
        :root {
            --bg: #fffdf5;
            --text: #333;
            --brand: #ff4757;
            --card: #fff;
            --unliked: #bbb;
            /* 新增：未点赞颜色 */
        }

        body.dark {
            --bg: #1a1a1a;
            --text: #f0f0f0;
            --brand: #ff6b81;
            --card: #2d2d2d;
            --unliked: hsl(227deg, 12%, 60%);
        }

        body {
            font-family: sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 30px 20px;
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
            transition: 0.3s;
        }

        h1 {
            color: var(--brand);
            font-size: 1.8rem;
            margin-bottom: 20px;
        }

        #c {
            white-space: pre-wrap;
            font-size: 1.1em;
            background: var(--card);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            min-height: 120px;
            margin-bottom: 30px;
        }

        .action-area {
            display: flex;
            justify-content: center; /* 居中显示 */
            margin-bottom: 40px;
        }

        .like-btn {
            background: var(--card);
            border: 2px solid var(--unliked);
            color: var(--unliked);
            padding: 10px 25px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1em;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .like-btn.active {
            background: var(--brand);
            border-color: var(--brand);
            color: white;
            animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 12px rgba(255, 71, 87, 0.3);
        }

        @keyframes pop {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.2);
            }

            100% {
                transform: scale(1);
            }
        }

        /* ================================= */

        /* 评论区样式 */
        .cmt-box {
            margin-top: 20px;
            border-top: 2px solid var(--brand);
            padding-top: 25px;
        }

        .cmt-item {
            background: rgba(128, 128, 128, 0.08);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        input {
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #ddd;
            background: var(--card);
            color: var(--text);
            flex: 1;
            outline: none;
        }

        .btn-send {
            background: var(--brand);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s;
        }

        .btn-send:active {
            transform: scale(1.1);
        }

        .lv-badge {
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.75em;
            font-weight: bold;
            margin-left: 5px;
            vertical-align: middle;
            position: relative;
            display: inline-block;
        }

        .lv-log {
            background: #8b5a2b;
            color: white;
        }

        .lv-iron {
            background: #4a4a4a;
            color: white;
        }

        .lv-bronze {
            background: #cd7f32;
            color: white;
        }

        .lv-silver {
            background: #e0e0e0;
            color: #333;
        }

        .lv-gold {
            background: #ffd700;
            color: #856404;
        }

        .lv-diamond {
            background: #b9f2ff;
            color: #007bff;
        }

        .lv-king {
            background: linear-gradient(45deg, #ffd700, #ffaa00);
            color: #fff;
            padding-right: 18px;
        }

        .lv-king::after {
            content: "V";
            position: absolute;
            right: 4px;
            font-style: italic;
            font-weight: 900;
        }

        .lv-epic {
            background: linear-gradient(45deg, #a333c8, #6d28d9);
            color: white;
            padding-right: 18px;
        }

        .lv-epic::after {
            content: "V";
            position: absolute;
            right: 4px;
            font-style: italic;
            font-weight: 900;
        }

        .nav-links {
            margin-top: 40px;
            display: flex;
            gap: 25px;
            justify-content: center;
        }

        .nav-links a {
            text-decoration: none;
            font-weight: bold;
            font-size: 1.05rem;
        }
    </style>
</head>

<body>
    <h1 id="t">...</h1>
    <div id="info"
        style="color:#888; font-size:0.9em; margin-bottom:20px; border-bottom:1px solid #eee; padding-bottom:10px;">
    </div>

    <div id="c">Loading...</div>

    <div class="action-area">
        <button id="btn-like" class="like-btn" onclick="toggleDetailLike()">
            👍 <span id="like-count">0</span>
        </button>
    </div>

    <div class="cmt-box">
        <h3 data-zh="💬 评论区" data-en="💬 Comments">💬 评论区</h3>
        <div id="cmt-list"></div>

        <div style="margin-top:25px; display:flex; gap:12px;">
            <input type="text" id="cC" data-zh-ph="神评由此诞生..." data-en-ph="Write a cool comment..." style="flex:1">
            <button onclick="addCmt()" class="btn-send" data-zh="发送" data-en="Send">发送</button>
        </div>
    </div>

    <div class="nav-links">
        <a href="othersPost.html" style="color:var(--brand);" data-zh="⬅️ 返回广场" data-en="⬅️ Back to Plaza">⬅️ 返回广场</a>
        <a href="home.html" style="color:#888;" data-zh="🏠 返回首页" data-en="🏠 Back Home">🏠 返回首页</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="db.js"></script>
    <script>
        const lang = localStorage.getItem('lang') || 'zh';
        if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark');

        document.querySelectorAll('[data-zh]').forEach(el => {
            el.innerText = (lang === 'zh' ? el.getAttribute('data-zh') : el.getAttribute('data-en'));
        });
        document.querySelectorAll('[data-zh-ph]').forEach(el => {
            el.placeholder = (lang === 'zh' ? el.getAttribute('data-zh-ph') : el.getAttribute('data-en-ph'));
        });
    </script>
    <script src="content.js"></script>
</body>

</html>
