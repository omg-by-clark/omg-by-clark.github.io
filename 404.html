<html lang="zh-CN">

<head>
        <!-- 本地数据同意脚本必须先于所有业务脚本加载。 -->
    <script src="privacy.js"></script>
<link rel="icon" href="logo.svg" type="image/svg+xml">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>找不到网址 • omg-by-Clark</title>
    <style>
        :root {
            --bg: #fffdf5;
            --text: #333;
            --brand: rgb(255, 71, 87);
        }

        body.dark {
            --bg: #1a1a1a;
            --text: #f0f0f0;
            --brand: #ff6b81;
        }

        body {
            font-family: sans-serif, "PingFang SC";
            display: block;
            text-align: center;
            user-select: none;
        }

        h1 {
            font-family: 'Google Sans Code', Consolas, Monaco, monospace;
            color: var(--brand);
            padding: 15px;
            border: 4px solid var(--brand);
            display: inline-block;
            border-radius: 12px;
            box-shadow: 6px 6px 0 var(--brand);
            user-select: none;
            font-weight: bold;
        }

        h2 {
            font-family: 'Noto Sans SC', 'Source Han Sans', 'PingFang SC',  sans-serif;
            color: var(--text);
        }

        a {
            color: var(--brand);
            font-weight: bold;
            border: none;
        }
    </style>
    <link rel="stylesheet" href="theme.css">
    <script src="theme.js"></script>
</head>

<body>
    <h1>omg-by-Clark.github.io</h1>
    <h2 data-zh="😕 哎呀，内容被外星人抓走了！" data-en="😕 Oops! The content was abducted by aliens!">
        😕 哎呀，内容被外星人抓走了！
    </h2>
    <p data-zh="😑 建议你检查一下网址有没有输对，是 omg-by-clark.github.io"
        data-en="😑 You might want to double-check that URL. It's omg-by-clark.github.io">
        😑 建议你检查一下网址有没有输对，是 omg-by-clark.github.io
    </p>
    <a href="index.html" data-zh="➡️ 首页链接" data-en="➡️ Link to Home Page">➡️ 首页链接</a>
    <script>
        // [init] 用于实现颜色和语言适配
        function init() {
            const language = localStorage.getItem('lang');
            const displayMode = localStorage.getItem('theme');
            if (displayMode == 'dark') {
                document.body.classList.add('dark');
            }
            document.querySelectorAll('[data-zh]').forEach(el => {
                const zhText = el.getAttribute('data-zh');
                const enText = el.getAttribute('data-en');
                el.innerText = (language === 'zh' ? zhText : enText);
            });
        }
    </script>
</body>

</html>
