<html lang="zh-CN">

<head>
    <!-- 本地数据同意脚本必须先于所有业务脚本加载。 -->
    <script src="privacy.js"></script>
    <link rel="icon" href="logo.svg" type="image/svg+xml">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 Sign In • omg-by-Clark</title>
    <style>
        /* :root 用途：定义浅色模式下的全局 CSS 变量。 */
        :root {
            --bg: #fffdf5;
            --text: #333;
            --brand: #ff4757;
            --card: #fff;
            --btn-cap-bg: #626880;
            --btn-cap-bg-success: #4fcc33;
            --error-text: #d20f39;
        }

        /* body.dark 用途：定义深色模式下的 CSS 变量。 */
        body.dark {
            --bg: #1a1a1a;
            --text: #f1f2f6;
            --brand: #ff6b81;
            --card: #1e1e1e;
            --btn-cap-bg: #7c7f93;
            --btn-cap-bg-success: #a6d189;
            --error-text: #df585a;
        }

        /* selection 用途：设置用户选择时的字体颜色 */
        ::selection {
            background: hsla(355, 100%, 75%, 0.3);
        }

        /* body 用途：设置页面整体的字体、居中布局和背景过渡效果。 */
        body {
            font-family: 'Noto Sans SC', 'Source Han Sans SC', 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            transition: 0.3s;
        }

        /* .auth-card 用途：设置登录/注册面板的卡片外观、阴影和内边距。 */
        .auth-card {
            background: var(--card);
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 320px;
            text-align: center;
        }

        /* h2 用途：设置卡片标题的品牌色和底部边距。 */
        h2 {
            color: var(--brand);
            margin-bottom: 25px;
        }

        /* input 用途：设置用户名和密码输入框的宽度、边距、边框及圆角。 */
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #444;
            background: var(--bg);
            color: var(--text);
            border-radius: 10px;
            box-sizing: border-box;
        }

        /* #pwd-error 用途：设置密码长度不足时的红色错误提示文本样式。 */
        #pwd-error {
            display: none;
            text-align: left;
            font-size: 0.85em;
            margin-top: -4px;
            margin-bottom: 10px;
            color: var(--error-text);
            font-weight: bold;
        }

        /* .auth-honeypot 用途：放置正常用户无法看到或聚焦的蜜罐输入框；自动填充所有字段的简单机器人容易误填它。 */
        .auth-honeypot {
            position: fixed;
            left: -10000px;
            width: 1px;
            height: 1px;
            overflow: hidden;
            opacity: 0;
            pointer-events: none;
        }

        /* .btn-go 用途：设置登录/注册主按钮的背景、字体和点击过渡效果。 */
        .btn-go {
            width: 100%;
            padding: 12px;
            background: var(--brand);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transform-origin: center;
            will-change: transform;
            transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.18s, background-color 0.18s;
        }

        /* .btn-go:active 用途：实现按钮点击时的放大特效。 */
        .btn-go:active {
            transform: scale(1.08, 0.94);
        }

        .checkbox-verification {
            display: none;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--unliked, #bbb);
            text-align: left;
        }

        .checkbox-progress {
            color: var(--text, #222);
            font-size: 1rem;
            line-height: 1.4;
            font-weight: 700;
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 12px;
        }

        .verify-box {
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 9px;
            background: var(--brand);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.16);
            cursor: pointer;
            touch-action: manipulation;
            user-select: none;
            padding: 0;
            position: relative;
            transform-origin: center;
            will-change: transform;
            transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.18s, box-shadow 0.18s;
        }

        .verify-box:focus-visible {
            outline: 3px solid rgba(255, 255, 255, 0.65);
            outline-offset: 3px;
        }

        .verify-box.is-drawing {
            transform: scale(1.04, 0.98);
            filter: brightness(1.02);
        }

        .verify-box.is-verified {
            background: var(--btn-cap-bg-success);
            cursor: default;
        }

        .verify-box-svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .verify-final-check {
            fill: none;
            stroke: #fff;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .verify-final-check {
            stroke-width: 7;
            opacity: 0;
            transition: opacity 0.16s ease;
        }

        .verify-box.is-verified .verify-final-check {
            opacity: 1;
        }

        /* .mode-toggle 用途：设置切换登录/注册及游客模式的链接文字样式。 */
        .mode-toggle {
            margin-top: 20px;
            font-size: 0.85em;
            color: #888;
            text-decoration: underline;
            cursor: pointer;
            display: block;
            transform-origin: center;
            will-change: transform;
            transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), color 0.18s;
        }

        /* .mode-toggle:active 用途：实现切换链接点击时的放大特效。 */
        .mode-toggle:active {
            transform: scale(1.08, 0.94);
        }

        /* .math-challenge 用途：承载低概率出现的数学人机验证题，并与登录卡片保持一致的排版。 */
        .math-challenge {
            display: none;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--unliked, #bbb);
            text-align: left;
        }

        /* .math-challenge-formula 用途：展示由本地 KaTeX 渲染的长公式；窄屏时允许横向滚动，避免撑破登录卡片。 */
        .math-challenge-formula {
            margin: 12px 0;
            overflow-x: auto;
            overflow-y: hidden;
            font-size: 0.82em;
            text-align: center;
        }

        /* .btn-math-submit 用途：提交数学题回答，沿用品牌色并保持全宽操作区域。 */
        .btn-math-submit {
            width: 100%;
            padding: 10px 16px;
            border: none;
            border-radius: 999px;
            background: var(--brand);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transform-origin: center;
            will-change: transform;
            transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.18s, background-color 0.18s;
        }

        .btn-math-submit:active {
            transform: scale(1.08, 0.94);
        }

        /* .slider-verification 用途：行为验证连续失败三次后，显示基于拖动速度与轨迹的备用验证方式。 */
        .slider-verification {
            display: none;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--unliked, #bbb);
            text-align: left;
        }

        .slider-verification p {
            margin: 6px 0 12px;
            color: var(--subtext, #777);
            font-size: 0.85em;
        }

        /* .slider-track 用途：提供从左到右的滑动范围，并裁切滑块与目标标记。 */
        .slider-track {
            position: relative;
            height: 42px;
            border: 1px solid var(--unliked, #bbb);
            border-radius: 999px;
            background: var(--bg);
            touch-action: none;
            user-select: none;
        }

        /* .slider-target 用途：标出本次随机生成的 60% 至 90% 目标位置。 */
        .slider-target {
            position: absolute;
            top: 5px;
            width: 8px;
            height: 32px;
            border-radius: 999px;
            background: var(--green, #a6da95);
            transform: translateX(-50%);
            box-shadow: 0 0 10px rgba(166, 218, 149, 0.55);
        }

        /* .slider-thumb 用途：作为用户实际拖动的圆形控制点；位置完全由可信 pointer 轨迹更新。 */
        .slider-thumb {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: var(--brand);
            cursor: grab;
            touch-action: none;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);
            will-change: transform;
        }

        .slider-thumb.dragging {
            cursor: grabbing;
        }

        /* 电脑端登录卡片 用途：在较宽屏幕上适度增加登录区域宽度，让数学公式和表单更舒展，同时避免卡片过宽。 */
        @media (min-width: 768px) {
            .auth-card {
                max-width: 420px;
            }
        }
    </style>

    <script defer src="vendor/katex/katex.min.js"></script>

</head>

<body>
    <div class="auth-card">
        <h2 id="title" data-zh="👋 你好呀！" data-en="👋 Hi there! ">👋 你好呀！</h2>

        <input type="text" id="u" data-zh-ph="用户名" data-en-ph="Username" placeholder="Username">
        <input type="password" id="p" data-zh-ph="密码" data-en-ph="Password" placeholder="Password">
        <div class="auth-honeypot" aria-hidden="true">
            <label for="auth-website">Website</label>
            <input type="text" id="auth-website" tabindex="-1" autocomplete="off">
        </div>
        <div id="pwd-error" data-zh="❗ 密码需要超过 6 位" data-en="❗ Password must be over 6 chars">❗ 密码需要超过 6 位</div>

        <button class="btn-go" onclick="handleAuth()" id="btn" data-zh="立即登录" data-en="Login">立即登录</button>
        <div id="checkbox-verification" class="checkbox-verification">
            <div class="checkbox-row">
                <button type="button" id="verify-box" class="verify-box" role="checkbox" aria-checked="false"
                    aria-label="Robot verification checkbox">
                    <svg class="verify-box-svg" viewBox="0 0 78 78" aria-hidden="true">
                        <path id="verify-final-check" class="verify-final-check" d="M18 41 L31 54 L57 23"></path>
                    </svg>
                </button>
                <div id="checkbox-progress" class="checkbox-progress"
                    data-zh="我不是机器人"
                    data-en="I'm not a robot">
                    我不是机器人
                </div>
            </div>
        </div>

        <div id="slider-verification" class="slider-verification">
            <strong data-zh="滑块验证" data-en="Slider verification">滑块验证</strong>
            <p data-zh="按住滑块，沿轨道拖到绿色标记处。" data-en="Hold the slider and drag it along the track to the green marker.">
                按住滑块，沿轨道拖到绿色标记处。</p>
            <div id="slider-track" class="slider-track">
                <div id="slider-target" class="slider-target"></div>
                <div id="slider-thumb" class="slider-thumb" role="slider" tabindex="0"
                    aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>

        </div>

        <div class="mode-toggle" onclick="toggle()" id="hint" data-zh="还没账号？点我注册" data-en="No account? Sign up">
            还没账号？点我注册</div>
        <div class="mode-toggle" onclick="window.location.href='index.html'" data-zh="不想登录？点我进入游客模式"
            data-en="Don't want to log in? Enter guest mode">
            不想登录？点我进入游客模式
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="db.js?v=20260801-ban-login-flow-3"></script>
    <script>
        /* getLang
        用途：读取当前页面语言；如果 localStorage 还没有记录，就默认写入中文。
        原理：登录页的标题、验证码和弹窗都通过这个函数取语言，避免某些地方把空值当成英文导致“你好呀”和“Verified”混用。
        */
        function getLang() {
            const savedLang = localStorage.getItem('lang');
            if (savedLang === 'en' || savedLang === 'zh') return savedLang;
            localStorage.setItem('lang', 'zh');
            return 'zh';
        }

        /* applySettings
        用途：页面加载时初始化主题和语言环境。
        原理：从 localStorage 读取 theme 和 lang 设置，并应用到 body 类和具有双语 data 属性的 DOM 元素上。
        */
        function applySettings() {
            if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark');
            const lang = getLang();
            document.querySelectorAll('[data-zh]').forEach(el => {
                el.innerText = lang === 'zh' ? el.getAttribute('data-zh') : el.getAttribute('data-en');
            });
            document.querySelectorAll('[data-zh-ph]').forEach(el => {
                el.placeholder = lang === 'zh' ? el.getAttribute('data-zh-ph') : el.getAttribute('data-en-ph');
            });
        }
        applySettings();

        let isReg = false;
        let pendingAuthData = null; // 用于在验证码验证期间暂存用户数据

        function getSafeRedirectPath() {
            const params = new URLSearchParams(window.location.search);
            const redirect = params.get('redirect');
            if (!redirect) return 'index.html';
            if (/^(https?:|\/\/)/i.test(redirect)) return 'index.html';
            if (redirect.includes('..') || redirect.startsWith('/') || redirect.startsWith('\\')) return 'index.html';
            return redirect;
        }

        /* toggle
        用途：在登录和注册模式之间切换UI。
        原理：修改全局变量 isReg，清空之前的错误提示与验证码，并根据当前语言动态更新标题、按钮文字和底部提示链接。
        */
        function toggle() {
            isReg = !isReg;
            resetAuthUI();
            document.getElementById('pwd-error').style.display = 'none';

            const lang = getLang();
            const t = document.getElementById('title');
            const b = document.getElementById('btn');
            const h = document.getElementById('hint');

            if (isReg) {
                t.innerText = lang === 'zh' ? "📝 注册新账号" : "📝 New Account";
                b.innerText = lang === 'zh' ? "立即创建" : "Sign Up";
                h.innerText = lang === 'zh' ? "已有账号？去登录" : "Back to Login";
            } else {
                t.innerText = lang === 'zh' ? "👋 你好呀！" : "👋 Hello there!";
                b.innerText = lang === 'zh' ? "立即登录" : "Login";
                h.innerText = lang === 'zh' ? "还没账号？点我注册" : "No account? Sign up";
            }
        }

        /* s256
        用途：对字符串进行 SHA-256 加密。
        原理：利用浏览器的 crypto.subtle.digest API，将明文密码转化为不可逆的哈希字符串，提高数据库安全性。
        */
        async function s256(str) {
            const buf = new TextEncoder().encode(str);
            const hash = await crypto.subtle.digest('SHA-256', buf);
            return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        function unwrapCompatRpcRow(data) {
            if (Array.isArray(data)) return data[0] || null;
            return data || null;
        }

        function appendSignInTrace(event, details = {}) {
            try {
                const traceKey = window.OMG_BAN && window.OMG_BAN.traceKey ? window.OMG_BAN.traceKey : 'omg_ban_trace_v1';
                const raw = sessionStorage.getItem(traceKey);
                const entries = raw ? JSON.parse(raw) : [];
                const safeEntries = Array.isArray(entries) ? entries : [];
                safeEntries.push({
                    time: new Date().toISOString(),
                    page: 'sign-in.html',
                    event: String(event || ''),
                    details: details && typeof details === 'object' ? details : { value: details }
                });
                while (safeEntries.length > 40) safeEntries.shift();
                sessionStorage.setItem(traceKey, JSON.stringify(safeEntries));
            } catch (error) {
                // 调试追踪失败时不影响正常登录流程。
            }
        }

        async function loginUserCompat(username, passwordSha256) {
            if (typeof loginUserWithRpc === 'function') {
                return loginUserWithRpc(username, passwordSha256);
            }
            const { data, error } = await _supabase.rpc('login_user', {
                p_username: username,
                p_password_sha256: passwordSha256
            });
            return { data: unwrapCompatRpcRow(data), error };
        }

        async function registerUserCompat(username, passwordSha256) {
            if (typeof registerUserWithRpc === 'function') {
                return registerUserWithRpc(username, passwordSha256);
            }
            const { data, error } = await _supabase.rpc('register_user', {
                p_username: username,
                p_password_sha256: passwordSha256
            });
            return { data: unwrapCompatRpcRow(data), error };
        }

        /* isMissingRpcError
        用途：判断 Supabase RPC 是否还没有创建，方便在你跑安全 SQL 前临时兼容旧登录流程。
        原理：PostgREST 找不到函数时通常会返回 PGRST202 或带 Could not find 的错误信息；其它错误按真实失败处理。
        */
        function isMissingRpcError(error) {
            if (!error) return false;
            const message = String(error.message || '');
            return error.code === 'PGRST202' || message.includes('Could not find') || message.includes('not found');
        }

        /* consumeAuthAttempt
        用途：限制同一标签页短时间内反复提交账号密码，减少简单循环脚本持续请求 Supabase。
        原理：在 sessionStorage 保存最近 60 秒的提交时间；窗口内达到 8 次后拒绝本次请求，关闭标签页后自动清除记录。
        */
        function consumeAuthAttempt() {
            const now = Date.now();
            const windowStart = now - 60 * 1000;
            let attempts;

            try {
                attempts = JSON.parse(sessionStorage.getItem('authAttemptTimes') || '[]')
                    .filter(time => Number.isFinite(time) && time >= windowStart);
            } catch (error) {
                attempts = [];
            }

            if (attempts.length >= 8) return false;
            attempts.push(now);
            sessionStorage.setItem('authAttemptTimes', JSON.stringify(attempts));
            return true;
        }

        /* handleAuth
        用途：处理点击“立即登录/注册”主按钮时的拦截与数据库校验。
        原理：如果是注册，检测密码长度；如果是登录，对密码加密并从 Supabase 验证；如果都正确，则隐藏当前按钮，显示 CAPTCHA 按钮供用户进行最后一步操作。
        */
        async function handleAuth() {
            if (window.requireLocalDataConsent && !window.requireLocalDataConsent()) return;
            const user = document.getElementById('u').value.trim();
            const pass = document.getElementById('p').value.trim();
            const pwdError = document.getElementById('pwd-error');
            const lang = getLang();
            appendSignInTrace('handle_auth:start', { user, isReg });

            pwdError.style.display = 'none';

            if (!user || !pass) return alert(lang === 'zh' ? "填完整再点！" : "Please fill in all fields!");
            if (document.getElementById('auth-website').value.trim()) {
                return alert(lang === 'zh' ? '验证失败，请刷新页面后重试。' : 'Verification failed. Refresh and try again.');
            }
            if (!consumeAuthAttempt()) {
                return alert(lang === 'zh' ? '操作太频繁，请一分钟后再试。' : 'Too many attempts. Try again in one minute.');
            }

            if (isReg) {
                if (pass.length <= 6) {
                    pwdError.style.display = 'block';
                    return;
                }
                // 校验通过，暂存数据并呼出验证码
                pendingAuthData = { action: 'reg', user, pass };
                showCaptchaUI();
            } else {
                // 登录模式：先查数据库确认密码是否正确
                const hp = await s256(pass);
                const { data, error } = await loginUserCompat(user, hp);
                appendSignInTrace('handle_auth:login_rpc_result', {
                    user,
                    hasData: Boolean(data),
                    error: error ? String(error.message || error.code || 'unknown') : ''
                });
                if (data) {
                    pendingAuthData = { action: 'login', user, data };
                    appendSignInTrace('handle_auth:show_captcha', { user });
                    showCaptchaUI();
                } else {
                    alert(lang === 'zh' ? "❌ 账号或密码不对哦" : "❌ Incorrect username or password");
                }
            }
        }

        /* showCaptchaUI
        用途：切换到登录后的验证界面。
        原理：默认展示自绘勾选框；若连续失败三次，则切换到滑块作为兜底验证。
        */
        function showCaptchaUI() {
            appendSignInTrace('show_captcha_ui', {
                action: pendingAuthData ? pendingAuthData.action : '',
                user: pendingAuthData ? pendingAuthData.user : ''
            });
            document.getElementById('btn').style.display = 'none';
            captchaShownAt = performance.now();
            resetCheckboxVerification();
            if (captchaFailureCount >= 3) {
                showSliderVerification();
                return;
            }
            showCheckboxVerification();
        }

        /* resetAuthUI
        用途：重置按钮和验证码的状态，以便用户切换模式或验证失败后再次操作。
        原理：恢复默认的 DOM display 属性，并清空勾选框与滑块的临时状态。
        */
        function resetAuthUI() {
            document.getElementById('btn').style.display = 'block';
            document.getElementById('checkbox-verification').style.display = 'none';
            document.getElementById('slider-verification').style.display = 'none';
            captchaPassed = false;
            pendingAuthData = null;
            resetCheckboxVerification();
        }

        const CAPTCHA_REQUIRED_SPACES = 3;
        const CAPTCHA_SPACE_WINDOW_MS = 4000;
        const CAPTCHA_SPACE_MIN_INTERVAL_MS = 3;
        let captchaPassed = false;
        let captchaShownAt = 0;
        let captchaFailureCount = Number(sessionStorage.getItem('captchaFailureCount') || 0);
        sessionStorage.removeItem('captchaLockedUntil'); // 清理旧版严格验证留下的冷却记录。
        let sliderTargetX = 0;
        const POINTER_TRAIL_WINDOW_MS = 1400;
        let sliderDragState = null;
        let checkboxPointerState = null;
        let checkboxSpaceTimes = [];
        let recentPointerTrail = [];
        let botMetrics = {
            trustedPointerMoves: 0,
            trustedKeyPresses: 0,
            trustedTouches: 0,
            hasWindowSize: false,
            touchArea: 0
        };

        function setCheckboxProgress(zh, en) {
            const progress = document.getElementById('checkbox-progress');
            progress.dataset.zh = zh;
            progress.dataset.en = en;
            progress.textContent = getLang() === 'zh' ? zh : en;
        }

        function getCheckboxDefaultProgress() {
            return {
                zh: '我不是机器人',
                en: "I'm not a robot"
            };
        }

        function showCheckboxVerification() {
            document.getElementById('checkbox-verification').style.display = 'block';
            document.getElementById('slider-verification').style.display = 'none';
            const text = getCheckboxDefaultProgress();
            setCheckboxProgress(text.zh, text.en);
        }

        function resetCheckboxVerification() {
            const verifyBox = document.getElementById('verify-box');
            checkboxPointerState = null;
            checkboxSpaceTimes = [];
            verifyBox.classList.remove('is-drawing', 'is-verified');
            verifyBox.setAttribute('aria-checked', 'false');
            const text = getCheckboxDefaultProgress();
            setCheckboxProgress(text.zh, text.en);
        }

        function finishCheckboxVerification() {
            if (captchaPassed) return;
            const verifyBox = document.getElementById('verify-box');
            verifyBox.classList.remove('is-drawing');
            verifyBox.classList.add('is-verified');
            verifyBox.setAttribute('aria-checked', 'true');
            setCheckboxProgress('验证通过，正在登录…', 'Verification passed. Signing in...');
            completeCaptchaVerification();
        }

        function pruneRecentPointerTrail(now = performance.now()) {
            recentPointerTrail = recentPointerTrail.filter(sample => now - sample.time <= POINTER_TRAIL_WINDOW_MS);
        }

        function getRecentPointerTrail(now = performance.now()) {
            pruneRecentPointerTrail(now);
            return recentPointerTrail.slice();
        }

        function getTrailStats(samples) {
            let travelled = 0;
            let maxStep = 0;
            let directionChanges = 0;
            let lastAngle = null;

            for (let index = 1; index < samples.length; index++) {
                const dx = samples[index].x - samples[index - 1].x;
                const dy = samples[index].y - samples[index - 1].y;
                const distance = Math.hypot(dx, dy);
                travelled += distance;
                maxStep = Math.max(maxStep, distance);
                if (distance >= 1) {
                    const angle = Math.atan2(dy, dx);
                    if (lastAngle !== null) {
                        let delta = Math.abs(angle - lastAngle);
                        if (delta > Math.PI) delta = (Math.PI * 2) - delta;
                        if (delta > 0.16) directionChanges++;
                    }
                    lastAngle = angle;
                }
            }

            const duration = samples.length > 1 ? samples[samples.length - 1].time - samples[0].time : 0;
            const uniquePositions = new Set(samples.map(sample => `${Math.round(sample.x)}:${Math.round(sample.y)}`)).size;
            return {
                travelled,
                maxStep,
                directionChanges,
                duration,
                uniquePositions,
                averageSpeed: duration > 0 ? travelled / (duration / 1000) : 0
            };
        }

        function analyzeCheckboxPointer(state, event) {
            const pageIsActive = document.visibilityState === 'visible' && document.hasFocus();
            const honeypotIsEmpty = !document.getElementById('auth-website').value.trim();
            if (!botMetrics.hasWindowSize || !pageIsActive || !honeypotIsEmpty) return false;

            const trail = state.trail || [];
            const endDelta = trail.length
                ? Math.hypot(trail[trail.length - 1].x - event.clientX, trail[trail.length - 1].y - event.clientY)
                : 0;
            const mobileContactLooksHuman = state.pointerType !== 'touch' || state.maxContactArea > 1 || botMetrics.touchArea > 1;

            if (state.pointerType === 'touch') {
                return mobileContactLooksHuman && botMetrics.trustedTouches >= 1;
            }

            if (trail.length < 4) return false;

            const stats = getTrailStats(trail);
            const first = trail[0];
            const last = trail[trail.length - 1];
            const straightDistance = Math.hypot(last.x - first.x, last.y - first.y);

            return (
                botMetrics.trustedPointerMoves >= 4 &&
                mobileContactLooksHuman &&
                stats.duration >= 90 &&
                stats.duration <= 2600 &&
                stats.travelled >= 14 &&
                stats.averageSpeed >= 24 &&
                stats.averageSpeed <= 2200 &&
                stats.maxStep <= 180 &&
                stats.uniquePositions >= 4 &&
                stats.directionChanges >= 0 &&
                stats.directionChanges <= 18 &&
                straightDistance >= 8 &&
                endDelta <= 28
            );
        }

        function pruneSpaceAttempts(now = performance.now()) {
            checkboxSpaceTimes = checkboxSpaceTimes.filter(time => now - time <= CAPTCHA_SPACE_WINDOW_MS);
        }

        function updateSpaceProgressLabel() {
            const count = Math.min(CAPTCHA_REQUIRED_SPACES, checkboxSpaceTimes.length);
            if (count === 0) {
                const text = getCheckboxDefaultProgress();
                setCheckboxProgress(text.zh, text.en);
                return;
            }

            setCheckboxProgress(
                `键盘验证进度：${count}/${CAPTCHA_REQUIRED_SPACES}`,
                `Keyboard progress: ${count}/${CAPTCHA_REQUIRED_SPACES}`
            );
        }

        function verifySpaceSequence() {
            pruneSpaceAttempts();
            updateSpaceProgressLabel();
            if (checkboxSpaceTimes.length < CAPTCHA_REQUIRED_SPACES) return;

            const recent = checkboxSpaceTimes.slice(-CAPTCHA_REQUIRED_SPACES);
            const intervals = [];
            for (let index = 1; index < recent.length; index++) {
                intervals.push(recent[index] - recent[index - 1]);
            }

            const valid = recent[recent.length - 1] - recent[0] <= CAPTCHA_SPACE_WINDOW_MS &&
                intervals.every(interval => interval > CAPTCHA_SPACE_MIN_INTERVAL_MS) &&
                botMetrics.trustedKeyPresses >= CAPTCHA_REQUIRED_SPACES &&
                document.activeElement === document.getElementById('verify-box');

            if (valid) {
                finishCheckboxVerification();
                return;
            }

            registerCaptchaFailure();
            checkboxSpaceTimes = [];
            updateSpaceProgressLabel();
            if (captchaFailureCount >= 3) {
                showSliderVerification();
            } else {
                alert(getLang() === 'zh' ? '按键节奏不太对，再试一次。' : 'The key rhythm did not look right. Try again.');
            }
        }

        if (window.innerWidth > 0 && window.innerHeight > 0) botMetrics.hasWindowSize = true;
        window.addEventListener('pointermove', event => {
            if (!event.isTrusted) return;
            botMetrics.trustedPointerMoves++;
            const now = performance.now();
            recentPointerTrail.push({
                x: event.clientX,
                y: event.clientY,
                time: now
            });
            pruneRecentPointerTrail(now);
        }, { passive: true });

        window.addEventListener('keydown', event => {
            if (event.isTrusted && !event.ctrlKey && !event.metaKey && !event.altKey) {
                botMetrics.trustedKeyPresses++;
            }
        }, { passive: true });

        window.addEventListener('touchstart', (e) => {
            if (!e.isTrusted || e.touches.length === 0) return;
            botMetrics.trustedTouches++;
            botMetrics.touchArea = Math.max(e.touches[0].radiusX || 1, e.touches[0].radiusY || 1);
        }, { passive: true });

        const verifyBox = document.getElementById('verify-box');

        verifyBox.addEventListener('pointerdown', event => {
            if (!event.isTrusted || !event.isPrimary) return;
            if (event.pointerType === 'mouse' && event.button !== 0) return;

            const now = performance.now();
            checkboxPointerState = {
                pointerId: event.pointerId,
                pointerType: event.pointerType || 'mouse',
                maxContactArea: Math.max(1, (event.width || 1) * (event.height || 1)),
                trail: getRecentPointerTrail(now)
            };
            checkboxSpaceTimes = [];
            verifyBox.classList.remove('is-verified');
            verifyBox.classList.add('is-drawing');
            setCheckboxProgress('正在检测本次勾选…', 'Checking this checkbox action...');
        });

        function finishCheckboxPointer(event) {
            const state = checkboxPointerState;
            checkboxPointerState = null;
            if (!state || !event.isTrusted || state.pointerId !== event.pointerId) return;

            state.maxContactArea = Math.max(state.maxContactArea, (event.width || 1) * (event.height || 1));
            verifyBox.classList.remove('is-drawing');

            if (analyzeCheckboxPointer(state, event)) {
                finishCheckboxVerification();
                return;
            }

            registerCaptchaFailure();
            const text = getCheckboxDefaultProgress();
            setCheckboxProgress(
                '这次勾选前的移动特征不太像真人，再正常点一下试试。',
                'That approach to the checkbox did not look natural enough. Try a normal click again.'
            );
            if (captchaFailureCount >= 3) {
                showSliderVerification();
            } else {
                setTimeout(() => {
                    if (!captchaPassed) setCheckboxProgress(text.zh, text.en);
                }, 900);
            }
        }

        verifyBox.addEventListener('pointerup', finishCheckboxPointer);
        verifyBox.addEventListener('pointercancel', () => {
            checkboxPointerState = null;
            verifyBox.classList.remove('is-drawing');
            const text = getCheckboxDefaultProgress();
            setCheckboxProgress(text.zh, text.en);
        });
        verifyBox.addEventListener('keydown', event => {
            if (!event.isTrusted || (event.key !== ' ' && event.code !== 'Space')) return;
            event.preventDefault();
            const now = performance.now();
            checkboxSpaceTimes.push(now);
            pruneSpaceAttempts(now);
            verifyBox.classList.remove('is-drawing');
            verifyBox.classList.remove('is-verified');
            verifyBox.setAttribute('aria-checked', 'false');
            verifySpaceSequence();
        });

        /* registerCaptchaFailure
        用途：记录连续行为验证失败，为第三次失败后的滑块备用验证提供依据。
        原理：次数保存在 sessionStorage，刷新页面后仍会继续使用滑块，验证成功才清除。
        */
        function registerCaptchaFailure() {
            captchaFailureCount++;
            sessionStorage.setItem('captchaFailureCount', String(captchaFailureCount));
        }

        /* showSliderVerification
        用途：在普通行为验证连续失败三次后切换为滑块验证。
        原理：每次显示时随机生成轨道 60% 至 90% 之间的目标点，避免机器人把终点位置写死。
        */
        function showSliderVerification() {
            document.getElementById('checkbox-verification').style.display = 'none';
            document.getElementById('slider-verification').style.display = 'block';
            resetCheckboxVerification();
            requestAnimationFrame(resetSliderVerification);
        }

        /* resetSliderVerification
        用途：把滑块放回起点并重新随机目标位置。
        原理：以滑块真正可移动的像素宽度计算目标，确保标记中心和滑块中心最终能够重合。
        */
        function resetSliderVerification() {
            const track = document.getElementById('slider-track');
            const thumb = document.getElementById('slider-thumb');
            const target = document.getElementById('slider-target');
            const usableWidth = Math.max(0, track.clientWidth - thumb.offsetWidth - 6);
            const targetRatio = 0.6 + Math.random() * 0.3;

            sliderTargetX = usableWidth * targetRatio;
            sliderDragState = null;
            thumb.style.transform = 'translateX(0px)';
            thumb.classList.remove('dragging');
            thumb.setAttribute('aria-valuenow', '0');
            target.style.left = `${3 + sliderTargetX + (thumb.offsetWidth / 2)}px`;
        }

        /* finishSliderVerification
        用途：根据终点、速度和完整拖动轨迹判断滑块操作是否可信。
        原理：要求至少 6 个可信采样点、合理拖动时长与平均速度、足够路径长度、不过多回拉、没有异常大跳点；移动端额外要求接触面积。
        */
        function finishSliderVerification(event) {
            const state = sliderDragState;
            sliderDragState = null;
            if (!state || !event.isTrusted || state.pointerId !== event.pointerId) return;

            const thumb = document.getElementById('slider-thumb');
            thumb.classList.remove('dragging');
            if (thumb.hasPointerCapture(event.pointerId)) thumb.releasePointerCapture(event.pointerId);

            const samples = state.samples;
            const duration = performance.now() - state.startedAt;
            let travelled = 0;
            let backwardMoves = 0;
            let maxStep = 0;

            for (let index = 1; index < samples.length; index++) {
                const dx = samples[index].x - samples[index - 1].x;
                travelled += Math.abs(dx);
                maxStep = Math.max(maxStep, Math.abs(dx));
                if (dx < -2) backwardMoves++;
            }

            const averageSpeed = duration > 0 ? travelled / (duration / 1000) : Infinity;
            const tolerance = Math.max(10, state.usableWidth * 0.04);
            const targetReached = Math.abs(state.currentX - sliderTargetX) <= tolerance;
            const trajectoryLooksHuman =
                samples.length >= 6 &&
                travelled >= sliderTargetX * 0.75 &&
                backwardMoves <= Math.max(2, samples.length * 0.3) &&
                maxStep <= state.trackWidth * 0.45;
            const speedLooksHuman = duration >= 300 && duration <= 6000 && averageSpeed >= 30 && averageSpeed <= 1500;
            const contactLooksHuman = state.pointerType !== 'touch' || state.maxContactArea > 1 || botMetrics.touchArea > 0;

            if (targetReached && trajectoryLooksHuman && speedLooksHuman && contactLooksHuman) {
                completeCaptchaVerification();
                return;
            }

            registerCaptchaFailure();
            alert(getLang() === 'zh' ? '等等！你似乎不是人！' : "Wait! You don't seem to be human!");
            resetSliderVerification();
        }

        const sliderThumb = document.getElementById('slider-thumb');

        sliderThumb.addEventListener('pointerdown', event => {
            if (!event.isTrusted || !event.isPrimary || event.button !== 0) return;

            const track = document.getElementById('slider-track');
            const thumbRect = sliderThumb.getBoundingClientRect();
            sliderDragState = {
                pointerId: event.pointerId,
                pointerType: event.pointerType,
                startedAt: performance.now(),
                grabOffset: event.clientX - thumbRect.left,
                usableWidth: Math.max(0, track.clientWidth - sliderThumb.offsetWidth - 6),
                trackWidth: track.clientWidth,
                currentX: 0,
                maxContactArea: Math.max(1, event.width * event.height),
                samples: [{ x: event.clientX, y: event.clientY, time: performance.now() }]
            };
            sliderThumb.classList.add('dragging');
            sliderThumb.setPointerCapture(event.pointerId);
            event.preventDefault();
        });

        sliderThumb.addEventListener('pointermove', event => {
            const state = sliderDragState;
            if (!state || !event.isTrusted || state.pointerId !== event.pointerId) return;

            const trackRect = document.getElementById('slider-track').getBoundingClientRect();
            const nextX = Math.min(
                Math.max(event.clientX - trackRect.left - 3 - state.grabOffset, 0),
                state.usableWidth
            );

            state.currentX = nextX;
            state.maxContactArea = Math.max(state.maxContactArea, event.width * event.height);
            state.samples.push({ x: event.clientX, y: event.clientY, time: performance.now() });
            sliderThumb.style.transform = `translateX(${nextX}px)`;
            sliderThumb.setAttribute('aria-valuenow', String(Math.round((nextX / state.usableWidth) * 100)));
            event.preventDefault();
        });

        sliderThumb.addEventListener('pointerup', finishSliderVerification);
        sliderThumb.addEventListener('pointercancel', finishSliderVerification);

        /* completeCaptchaVerification
        用途：统一完成勾选验证和滑块验证的成功流程。
        原理：清除失败次数并短暂停留后执行真正登录，避免不同验证方式重复维护登录收口。
        */
        function completeCaptchaVerification() {
            if (captchaPassed) return;
            captchaPassed = true;
            captchaFailureCount = 0;
            sessionStorage.removeItem('captchaFailureCount');
            document.getElementById('slider-verification').style.display = 'none';
            setTimeout(executeFinalAuth, 280);
        }

        /* executeFinalAuth
        用途：当用户通过行为验证码后，执行真正的数据库写入或本地状态保存。
        原理：读取暂存区的 pendingAuthData 中的操作类型和用户数据，调用 Supabase API 完成数据落库，并发放奖励后重定向至主页。
        */
        async function executeFinalAuth() {
            const lang = getLang();
            appendSignInTrace('execute_final_auth:start', {
                action: pendingAuthData ? pendingAuthData.action : '',
                user: pendingAuthData ? pendingAuthData.user : ''
            });

            if (pendingAuthData.action === 'reg') {
                const hp = await s256(pendingAuthData.pass);
                const { error } = await registerUserCompat(pendingAuthData.user, hp);

                if (error) {
                    alert(lang === 'zh' ? "注册失败：名字可能被占用了" : "Failed: Username might be taken");
                    resetAuthUI();
                } else {
                    alert(lang === 'zh' ? "注册成功！去登录吧" : "Registered! Please log in");
                    document.getElementById('p').value = ""; // 清空密码框
                    toggle();
                }
            } else if (pendingAuthData.action === 'login') {
                const data = pendingAuthData.data;
                const reward = Number(data.login_reward || 5);
                const currentPoints = Number(data.points || 0);
                appendSignInTrace('execute_final_auth:login', {
                    username: data.username,
                    reward,
                    currentPoints
                });

                localStorage.setItem('username', data.username);
                localStorage.setItem('id_im', String(data.id));
                localStorage.setItem('userPoints', currentPoints);
                if (pendingAuthData.user === 'Clark') localStorage.setItem('isAdmin', 'true');

                if (window.OMG_BAN && typeof window.OMG_BAN.ensureAccess === 'function') {
                    const banCheck = await window.OMG_BAN.ensureAccess({
                        username: data.username,
                        forceRefresh: true,
                        redirectOnDeny: true,
                        forceOnSignInPage: true
                    });
                    appendSignInTrace('execute_final_auth:ban_check_result', {
                        username: data.username,
                        allowed: Boolean(banCheck && banCheck.allowed),
                        hasState: Boolean(banCheck && banCheck.state)
                    });
                    if (!banCheck.allowed) return;
                }

                alert(lang === 'zh' ? `🎁 登录奖励：+${reward} 积分！` : `🎁 Login Bonus: +${reward} pts!`);

                window.location.href = getSafeRedirectPath();
            }
        }
    </script>
</body>
