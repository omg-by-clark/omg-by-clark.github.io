<!DOCTYPE html>
<!-- postNow.html -->
<html lang="zh-CN">

<head>
    <link rel="icon" href="logo.svg" type="image/svg+xml">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>编写吐槽 - omg-by-Clark</title>
    <style>
        :root {
            --bg: #fffdf5;
            --text: #333;
            --subtext: #6c6f85;
            --brand: #ff4757;
            /* ^红色 */
            --green: #6fcf2f;
            /* ^使用 Catppuccin Frappe 绿色的改版 */

            /* 关键词按钮颜色配置 */
            --kw-default: #ccc;
            --kw-dark-default: hsl(227deg, 12%, 60%);
            --kw-active: #49b530; /* 修改：普通选中关键词的颜色 */
            --kw-nsfw-active: #fe640b; /* 新增：NSFW选中时的颜色 */
        }

        body.dark {
            --bg: #121212;
            --text: #f1f2f6;
            --brand: #ff6b81;
            --subtext: #a5adce;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            transition: 0.3s;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 1.8em;
        }

        .id-box {
            margin-bottom: 20px;
            opacity: 0.8;
            font-size: 0.9em;
            text-align: left;
            width: 100%;
        }

        input,
        textarea {
            font-family: sans-serif, Pingfang SC;
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background: #fff;
            box-sizing: border-box;
            font-size: 1em;
        }

        body.dark input,
        body.dark textarea {
            font-family: sans-serif, "PingFang SC";
            background: #1e1e1e;
            border-color: #444;
            color: #fff;
        }

        /* 关键词区域样式 */
        .kw-container {
            margin-bottom: 20px;
            text-align: left;
        }

        .kw-label {
            font-size: 0.9em;
            margin-bottom: 8px;
            display: block;
            opacity: 0.9;
        }

        .kw-btn {
            border: none;
            border-radius: 20px;
            /* 圆角按钮 */
            padding: 8px 16px;
            margin-right: 8px;
            margin-bottom: 8px;
            font-size: 0.9em;
            cursor: pointer;
            transition: 0.2s;
            background: var(--kw-default);
            color: #333;
            font-weight: 500;
        }

        body.dark .kw-btn {
            background: var(--kw-dark-default);
            color: #fff;
        }

        /* 选中状态：深浅色模式一致 */
        .kw-btn.active {
            background: var(--kw-active) !important;
            color: white !important;
            font-weight: bold;
            transform: scale(1.05);
        }

        /* 新增：NSFW 按钮选中时的特殊高亮样式 */
        .kw-btn.nsfw-btn.active {
            background: var(--kw-nsfw-active) !important;
        }

        /* NSFW 关键词的介绍 */
        .describe-nsfw {
            color: var(--subtext);
            font-size: 0.85em;
            opacity: 0.7;
            margin-top: 10px;
            margin-bottom: 10px;
        }

        /* 立即发布按钮：采用绿色 */
        .btn-post {
            width: 100%;
            padding: 15px;
            background-color: var(--green);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: 0.1s;
        }

        /* 按钮被禁用时的样式 */
        .btn-post:disabled {
            background-color: #ccc;
            cursor: not-allowed;
            transform: none !important;
        }

        /* 返回首页按钮：红色样式 */
        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: var(--brand);
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1em;
            transition: 0.1s;
        }

        /* 统一 1.1 倍缩放 */
        .btn-post:active:not(:disabled),
        .back-link:active {
            transform: scale(1.1);
        }
    </style>
</head>

<body>
    <div class="container">
        <h1 data-zh="💥 编写吐槽" data-en="💥 Write Rant">💥 编写吐槽</h1>

        <div class="id-box">
            <span data-zh="当前身份：" data-en="Identity: ">当前身份：</span>
            <b id="who-am-i">...</b>
        </div>

        <form id="pForm">
            <input type="text" id="t" data-zh-ph="起个标题……" data-en-ph="Rant Title..." 
            placeholder="起个标题……" required>
            <textarea id="c" rows="10" data-zh-ph="请开始你的表演……" data-en-ph="Start your story..." placeholder="请开始你的表演……"
                required></textarea>

            <div class="kw-container">
                <span class="kw-label" data-zh="添加关键词（可选）：" data-en="Add Keywords (Optional):">添加关键词（可选）：</span>
                <div id="kw-area"></div>
            </div>
            <div class="describe-nsfw" data-zh="💡 NSFW 代表不建议在工作/学校场合阅读（全称：Not Safe For Work）。" 
                 data-en="💡 NSFW means 'Not Safe For Work'.">
                💡 NSFW 代表不建议在工作/学校场合阅读（全称：Not Safe For Work）。
            </div>
            <button type="submit" id="submit-btn" class="btn-post" data-zh="立即发布" data-en="Publish Now">立即发布</button>
        </form>
        <a href="index.html" class="back-link" data-zh="🏠 返回首页" data-en="🏠 Back Home">🏠 返回首页</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="db.js"></script>
    <script>
        // 初始化变量
        const user = localStorage.getItem('username');
        const lang = localStorage.getItem('lang') || 'zh';
        
        // 全局状态锁，防止重复提交
        let isSubmitting = false;

        const KEYWORDS_LIST = ['#学校 School',
            '#老师 Teachers', '#作业 Homework',
            '#家人 Family', '#避雷 Avoid',
            '#奸商 Scammer', '#编程 Coding',
            '#上课 Class', '#旅游 Travel',
            '#奇葩 Weird', '#食物 Food',
            '#生活 Life', '#宠物 Pets',
            '#科技 Tech', '#娱乐 Fun', '#体育 Sport',
            '#其他 Others', '#NSFW', '#搬运 Reposted'];

        /*
          init() 
          用法：页面加载时执行的基础初始化操作。
          原理：
          1. 根据 localStorage 判断是否需给 body 添加 dark 模式类。
          2. 检查用户登录状态，拦截未登录访问并踢回首页。
          3. 抓取带 data- 属性的 DOM 元素，处理中英文文本及输入框占位符的翻译。
          4. 遍历 KEYWORDS_LIST 动态生成关键词按钮。如果是新加的 '#NSFW'，则单独为其赋予 'nsfw-btn' 类，以便与 CSS 中的高亮变量呼应。
         */
        function init() {
            if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark');

            if (!user) {
                alert(lang === 'zh' ? "请先登录！" : "Please login first!");
                window.location.href = 'index.html';
                return;
            }
            document.getElementById('who-am-i').innerText = user;

            // 翻译
            document.querySelectorAll('[data-zh]').forEach(el => {
                el.innerText = lang === 'zh' ? el.getAttribute('data-zh') : el.getAttribute('data-en');
            });
            document.querySelectorAll('[data-zh-ph]').forEach(el => {
                el.placeholder = lang === 'zh' ? el.getAttribute('data-zh-ph') : el.getAttribute('data-en-ph');
            });

            // 生成关键词按钮
            const kwArea = document.getElementById('kw-area');
            KEYWORDS_LIST.forEach(kw => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'kw-btn';
                
                // 专门给 NSFW 按钮加上标识类名
                if (kw === '#NSFW' || kw === '#搬运 Reposted') {
                    btn.classList.add('nsfw-btn');
                }
                
                btn.innerText = kw;
                btn.onclick = () => btn.classList.toggle('active');
                kwArea.appendChild(btn);
            });
        }
        init();

        /*
          表单 submit 事件监听
           用法：处理点击“立即发布”后的异步上传逻辑。
           原理：
           1. 阻止表单默认刷新行为，并通过 isSubmitting 变量加锁，防止用户连点造成网络拥堵和数据重复。
           2. 改变提交按钮的文本和禁用状态，提供即时的 UI 反馈。
           3. 收集输入框的值，并查找所有带有 active 类的关键词按钮，提取出纯文本数组存入 selectedKws。
           4. 调用 Supabase API，向 posts 表插入包含昵称、标题、内容和关键词数组的新记录。
           5. 发帖成功后，查询并在 users 表中给当前用户的积分加上 10 分，更新本地存储。
           6. 处理完毕则弹窗并跳转回首页。如果过程中发生任何错误，catch 会捕获异常，解除提交锁并恢复按钮原始状态。
         */
        document.getElementById('pForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            // 如果已经在提交中，直接静默退出
            if (isSubmitting) return;

            // 立即上锁
            isSubmitting = true;

            const submitBtn = document.getElementById('submit-btn');
            const originalText = submitBtn.innerText;

            // 禁用按钮并改变文字
            submitBtn.disabled = true;
            submitBtn.innerText = lang === 'zh' ? "发布中..." : "Posting...";

            const title = document.getElementById('t').value.trim();
            const content = document.getElementById('c').value.trim();
            
            // 抓取所有被选中的关键词按钮文本
            const selectedKws = Array.from(document.querySelectorAll('.kw-btn.active'))
                .map(btn => btn.innerText);

            try {
                // 发帖
                const { error: postErr } = await _supabase.from('posts').insert([{
                    nickname: user,
                    title: title,
                    content: content,
                    likes: 0,
                    keywords: selectedKws
                }]);

                if (postErr) throw postErr;

                // 自动加 10 分
                const { data: userData } = await _supabase.from('users').select('points').eq('username', user).single();
                const newPts = (userData ? userData.points : 0) + 10;

                await _supabase.from('users').update({ points: newPts }).eq('username', user);
                localStorage.setItem('userPoints', newPts);

                alert(lang === 'zh' ? "发布成功！积分+10" : "Success! Points +10");
                window.location.href = 'index.html';

            } catch (err) {
                alert("Error: " + err.message);
                console.error("[错误]" + err);
                
                // 如果出错，释放锁并恢复按钮
                isSubmitting = false;
                submitBtn.disabled = false;
                submitBtn.innerText = originalText;
            }
        });
    </script>
</body>

</html>
