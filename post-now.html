<html lang="zh-CN">

<head>
    <link rel="icon" href="logo.svg" type="image/svg+xml">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>编写吐槽 • omg-by-Clark</title>
    <style>
        :root {
            --bg: #fffdf5;
            --text: #333;
            --subtext: #6c6f85;
            --brand: #ff4757;
            /* ^红色 */
            --green: #6fcf2f;
            /* ^使用 Catppuccin Frappe 绿色的改版 */

            /* 关键词按钮颜色配置 */
            --kw-default: #ccc;
            --kw-dark-default: hsl(227deg, 12%, 60%);
            --kw-active: #49b530; /* 修改：普通选中关键词的颜色 */
            --kw-nsfw-active: #fe640b; /* 新增：NSFW选中时的颜色 */
            --button: #fe9152;
        }

        body.dark {
            --bg: #121212;
            --text: #f1f2f6;
            --brand: #ff6b81;
            --subtext: #a5adce;
            --button: #fab387;
        }

        /* selection 用途：设置用户选择时的字体颜色 */
        ::selection {
            background: hsla(355, 100%, 75%, 0.3);
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            transition: 0.3s;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 1.8em;
        }

        .id-box {
            margin-bottom: 20px;
            opacity: 0.8;
            font-size: 0.9em;
            text-align: left;
            width: 100%;
        }

        input,
        textarea {
            font-family: sans-serif, Pingfang SC;
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background: #fff;
            box-sizing: border-box;
            font-size: 1em;
        }

        /* .post-content-wrap 用途：给正文输入框和图片上传按钮提供同一个定位容器，让按钮固定在输入框左下角。 */
        .post-content-wrap {
            position: relative;
            margin-bottom: 8px;
        }

        /* .post-content-wrap textarea 用途：为左下角上传按钮预留空间，避免正文文字和按钮互相覆盖。 */
        .post-content-wrap textarea {
            margin-bottom: 0;
            padding-bottom: 58px;
            resize: vertical;
        }

        body.dark input,
        body.dark textarea {
            font-family: sans-serif, "PingFang SC";
            background: #1e1e1e;
            border-color: #444;
            color: #fff;
        }

        /* .btn-upload-image 用途：设置图片上传入口，使用 --brand 主题色并贴在正文输入框左下角。 */
        .btn-upload-image {
            position: absolute;
            left: 12px;
            bottom: 14px;
            background: var(--brand);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 8px 12px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.1s;
        }

        /* .btn-upload-image:active 用途：保持页面现有按钮按下时轻微放大的反馈。 */
        .btn-upload-image:active {
            transform: scale(1.06);
        }

        /* .image-status 用途：展示当前图片选择 / 转换状态，文字保持轻量，不打断发帖流程。 */
        .image-status {
            min-height: 1.2em;
            margin-bottom: 12px;
            color: var(--subtext);
            font-size: 0.85em;
            overflow-wrap: break-word;
        }

        /* .image-preview-wrap 用途：显示用户已选择图片的小预览，确认图片来源，不占太多发帖空间。 */
        .image-preview-wrap {
            display: none;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        /* .image-preview 用途：把预览图限制成小缩略图，使用 object-fit 保持图片比例。 */
        .image-preview {
            width: 96px;
            height: 72px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid rgba(128, 128, 128, 0.35);
            background: var(--bg);
        }

        /* 关键词区域样式 */
        .kw-container {
            margin-bottom: 20px;
            text-align: left;
        }

        .kw-label {
            font-size: 0.9em;
            margin-bottom: 8px;
            display: block;
            opacity: 0.9;
        }

        .kw-btn {
            border: none;
            border-radius: 20px;
            /* 圆角按钮 */
            padding: 8px 16px;
            margin-right: 8px;
            margin-bottom: 8px;
            font-size: 0.9em;
            cursor: pointer;
            transition: 0.2s;
            background: var(--kw-default);
            color: #333;
            font-weight: 500;
        }

        body.dark .kw-btn {
            background: var(--kw-dark-default);
            color: #fff;
        }

        /* 选中状态：深浅色模式一致 */
        .kw-btn.active {
            background: var(--kw-active) !important;
            color: white !important;
            font-weight: bold;
            transform: scale(1.05);
        }

        /* 新增：NSFW 按钮选中时的特殊高亮样式 */
        .kw-btn.nsfw-btn.active {
            background: var(--kw-nsfw-active) !important;
        }

        /* NSFW 关键词的介绍 */
        .advice {
            color: var(--subtext);
            font-size: 0.85em;
            opacity: 0.7;
            margin-top: 10px;
            margin-bottom: 10px;
        }

        /* 立即发布按钮：采用绿色 */
        .btn-post {
            width: 100%;
            padding: 15px;
            background-color: var(--green);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: 0.1s;
        }

        /* 按钮被禁用时的样式 */
        .btn-post:disabled {
            background-color: #ccc;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-go-to-advice {
            display: inline-block;
            margin-right: 15px;
            color: var(--button);
            text-decoration: none;
            font-size: 0.9em;
            transition: 0.1s;
        }

        /* 返回首页按钮：红色样式 */
        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: var(--brand);
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1em;
            transition: 0.1s;
        }

        /* 统一 1.1 倍缩放 */
        .btn-post:active:not(:disabled),
        .back-link:active {
            transform: scale(1.1);
        }
    </style>
</head>

<body>
    <div class="container">
        <h1 data-zh="💥 编写吐槽" data-en="💥 Write Rant">💥 编写吐槽</h1>

        <div class="id-box">
            <span data-zh="当前身份：" data-en="Identity: ">当前身份：</span>
            <b id="who-am-i">...</b>
        </div>

        <form id="pForm">
            <input type="text" id="t" data-zh-ph="起个标题……" data-en-ph="Rant Title..."
            placeholder="起个标题……" required>
            <div class="post-content-wrap" id="post-content-wrap">
                <textarea id="c" rows="10" data-zh-ph="请开始你的表演……" data-en-ph="Start your story..." placeholder="请开始你的表演……"
                    required></textarea>
                <button type="button" id="btn-upload-image" class="btn-upload-image" data-zh="🖼 上传图片"
                    data-en="🖼 Upload Image" onclick="openPhotoPicker()">🖼 上传图片</button>
                <input type="file" id="photo-input" accept="image/*" hidden>
            </div>
            <div id="image-status" class="image-status"></div>
            <div id="image-preview-wrap" class="image-preview-wrap">
                <img id="image-preview" class="image-preview" alt="">
            </div>

            <div class="kw-container">
                <span class="kw-label" data-zh="添加关键词（可选）：" data-en="Add Keywords (Optional):">添加关键词（可选）：</span>
                <div id="kw-area"></div>
            </div>
            <div class="advice" data-zh="💡 NSFW 代表不建议在工作/学校场合阅读（全称：Not Safe For Work）。"
                 data-en="💡 NSFW means 'Not Safe For Work'.">
                💡 NSFW 代表不建议在工作/学校场合阅读（全称：Not Safe For Work）。
            </div>
            <button type="submit" id="submit-btn" class="btn-post" data-zh="立即发布" data-en="Publish Now">立即发布</button>
        </form>
        <a href="index.html" class="back-link" data-zh="🏠 返回首页" data-en="🏠 Back Home">🏠 返回首页</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="db.js"></script>
    <script>
        // 初始化变量
        const user = localStorage.getItem('username');
        const lang = localStorage.getItem('lang') || 'zh';

        // 全局状态锁，防止重复提交
        let isSubmitting = false;

        // 保存用户选择、粘贴或拖拽进来的图片。真正上传前会先转成 WebP Blob。
        let selectedPhotoBlob = null;
        let selectedPhotoName = '';
        let photoConversionPromise = null;
        let photoSelectionToken = 0;
        let photoPreviewUrl = '';

        const KEYWORDS_LIST = ['#学校 School',
            '#老师 Teachers', '#作业 Homework',
            '#家人 Family', '#避雷 Avoid',
            '#奸商 Scammer', '#编程 Coding',
            '#上课 Class', '#旅游 Travel',
            '#奇葩 Weird', '#食物 Food',
            '#生活 Life', '#宠物 Pets',
            '#科技 Tech', '#娱乐 Fun', '#体育 Sport',
            '#其他 Others', '#NSFW', '#搬运 Reposted'];

        /*
          init()
          用法：页面加载时执行的基础初始化操作。
          原理：
          1. 根据 localStorage 判断是否需给 body 添加 dark 模式类。
          2. 检查用户登录状态，拦截未登录访问并踢回首页。
          3. 抓取带 data- 属性的 DOM 元素，处理中英文文本及输入框占位符的翻译。
          4. 遍历 KEYWORDS_LIST 动态生成关键词按钮。如果是新加的 '#NSFW'，则单独为其赋予 'nsfw-btn' 类，以便与 CSS 中的高亮变量呼应。
         */
        function init() {
            if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark');

            if (!user) {
                alert(lang === 'zh' ? "请先登录！" : "Please login first!");
                window.location.href = 'index.html';
                return;
            }
            document.getElementById('who-am-i').innerText = user;

            // 翻译
            document.querySelectorAll('[data-zh]').forEach(el => {
                el.innerText = lang === 'zh' ? el.getAttribute('data-zh') : el.getAttribute('data-en');
            });
            document.querySelectorAll('[data-zh-ph]').forEach(el => {
                el.placeholder = lang === 'zh' ? el.getAttribute('data-zh-ph') : el.getAttribute('data-en-ph');
            });

            // 生成关键词按钮
            const kwArea = document.getElementById('kw-area');
            KEYWORDS_LIST.forEach(kw => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'kw-btn';

                // 专门给 NSFW 按钮加上标识类名
                if (kw === '#NSFW' || kw === '#搬运 Reposted') {
                    btn.classList.add('nsfw-btn');
                }

                btn.innerText = kw;
                btn.onclick = () => btn.classList.toggle('active');
                kwArea.appendChild(btn);
            });
        }
        init();

        /*
          setImageStatus()
          用法：更新图片上传入口下面的状态文字。
          原理：图片选择、转换成功、转换失败都只需要改同一个 DOM 节点；这里集中处理语言切换后的中英文文案。
         */
        function setImageStatus(zhText, enText) {
            document.getElementById('image-status').innerText = lang === 'zh' ? zhText : enText;
        }

        /*
          clearPhotoPreview()
          用法：清空图片预览，并释放之前创建的 object URL。
          原理：浏览器会为 URL.createObjectURL 占用内存；换图或转换失败时主动 revoke，避免页面停留久了积累资源。
         */
        function clearPhotoPreview() {
            const previewWrap = document.getElementById('image-preview-wrap');
            const previewImg = document.getElementById('image-preview');

            if (photoPreviewUrl) {
                URL.revokeObjectURL(photoPreviewUrl);
                photoPreviewUrl = '';
            }

            previewImg.removeAttribute('src');
            previewImg.alt = '';
            previewWrap.style.display = 'none';
        }

        /*
          showPhotoPreview()
          用法：图片成功转换成 WebP 后，显示一个小缩略图给用户确认。
          原理：直接预览最终要上传的 WebP Blob，保证用户看到的内容和实际存进 photos 桶的内容一致。
         */
        function showPhotoPreview(webpBlob, sourceName) {
            const previewWrap = document.getElementById('image-preview-wrap');
            const previewImg = document.getElementById('image-preview');

            clearPhotoPreview();
            photoPreviewUrl = URL.createObjectURL(webpBlob);
            previewImg.src = photoPreviewUrl;
            previewImg.alt = lang === 'zh' ? `图片预览：${sourceName}` : `Image preview: ${sourceName}`;
            previewWrap.style.display = 'flex';
        }

        /*
          openPhotoPicker()
          用法：点击“上传图片”按钮时打开系统文件选择器。
          原理：真正的 file input 被隐藏，按钮只负责触发 click，这样 UI 可以保持当前页面的品牌色样式。
         */
        function openPhotoPicker() {
            document.getElementById('photo-input').click();
        }

        /*
          drawFileToCanvas()
          用法：把浏览器能解码的图片文件绘制到 canvas 上。
          原理：优先使用 createImageBitmap，它对本地 File 支持好；如果浏览器不支持或解码失败，再回退到 Image + object URL。
         */
        async function drawFileToCanvas(file) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');

            try {
                const bitmap = await createImageBitmap(file);
                canvas.width = bitmap.width;
                canvas.height = bitmap.height;
                ctx.drawImage(bitmap, 0, 0);
                bitmap.close();
                return canvas;
            } catch (err) {
                return new Promise((resolve, reject) => {
                    const img = new Image();
                    const objectUrl = URL.createObjectURL(file);

                    img.onload = () => {
                        canvas.width = img.naturalWidth;
                        canvas.height = img.naturalHeight;
                        ctx.drawImage(img, 0, 0);
                        URL.revokeObjectURL(objectUrl);
                        resolve(canvas);
                    };
                    img.onerror = () => {
                        URL.revokeObjectURL(objectUrl);
                        reject(new Error(lang === 'zh' ? '无法读取这张图片' : 'Could not read this image'));
                    };
                    img.src = objectUrl;
                });
            }
        }

        /*
          convertImageFileToWebp()
          用法：把用户提供的图片文件转换成 image/webp Blob。
          原理：先把图片画进 canvas，再用 canvas.toBlob('image/webp') 导出。Supabase Storage 最终只接收这个 WebP 文件。
         */
        async function convertImageFileToWebp(file) {
            const canvas = await drawFileToCanvas(file);

            return new Promise((resolve, reject) => {
                canvas.toBlob(blob => {
                    if (blob) {
                        resolve(blob);
                    } else {
                        reject(new Error(lang === 'zh' ? '图片转换失败' : 'Image conversion failed'));
                    }
                }, 'image/webp', 0.9);
            });
        }

        /*
          handlePhotoFile()
          用法：处理按钮选择、Ctrl+V 粘贴、拖拽放入输入框得到的图片文件。
          原理：这里只保存一张图，后选择的图片会覆盖前一张；转换过程保存成 Promise，提交时会等待它完成。
         */
        function handlePhotoFile(file) {
            if (!file || !file.type.startsWith('image/')) return;

            const selectionToken = ++photoSelectionToken;
            const sourceName = file.name || 'pasted-image';
            selectedPhotoBlob = null;
            selectedPhotoName = sourceName;
            clearPhotoPreview();
            setImageStatus(`正在转换图片：${sourceName}`, `Converting image: ${sourceName}`);

            photoConversionPromise = convertImageFileToWebp(file)
                .then(blob => {
                    if (selectionToken !== photoSelectionToken) return null;
                    selectedPhotoBlob = blob;
                    showPhotoPreview(blob, sourceName);
                    setImageStatus(`已选择图片：${sourceName}`, `Image selected: ${sourceName}`);
                    return blob;
                })
                .catch(err => {
                    if (selectionToken !== photoSelectionToken) return null;
                    selectedPhotoBlob = null;
                    selectedPhotoName = '';
                    clearPhotoPreview();
                    setImageStatus('图片读取或转换失败', 'Could not read or convert the image');
                    alert(err.message);
                    return null;
                });
        }

        /*
          bindPhotoInputEvents()
          用法：为发帖输入框绑定文件选择、粘贴和拖拽图片事件。
          原理：三种入口最终都拿到 File 对象，再交给 handlePhotoFile 统一转换，避免多处维护重复逻辑。
         */
        function bindPhotoInputEvents() {
            const textarea = document.getElementById('c');
            const dropArea = document.getElementById('post-content-wrap');
            const fileInput = document.getElementById('photo-input');

            fileInput.addEventListener('change', () => {
                handlePhotoFile(fileInput.files[0]);
                fileInput.value = '';
            });

            textarea.addEventListener('paste', event => {
                const item = Array.from(event.clipboardData?.items || [])
                    .find(clipItem => clipItem.type.startsWith('image/'));
                if (item) handlePhotoFile(item.getAsFile());
            });

            dropArea.addEventListener('dragover', event => {
                event.preventDefault();
            });

            dropArea.addEventListener('drop', event => {
                event.preventDefault();
                const file = Array.from(event.dataTransfer?.files || [])
                    .find(droppedFile => droppedFile.type.startsWith('image/'));
                if (file) handlePhotoFile(file);
            });
        }
        bindPhotoInputEvents();

        /*
          uploadPostPhoto()
          用法：帖子成功创建并拿到 id 后，把 WebP 图片上传到 photos 桶。
          原理：Storage 路径固定为 “帖子id.webp”，详情页只要用当前 postId 拼出同一路径即可查到图片。
         */
        async function uploadPostPhoto(postId, webpBlob) {
            const { error } = await _supabase.storage
                .from('photos')
                .upload(`${postId}.webp`, webpBlob, {
                    contentType: 'image/webp',
                    upsert: false
                });

            if (error) throw error;
        }

        /*
          表单 submit 事件监听
           用法：处理点击“立即发布”后的异步上传逻辑。
           原理：
           1. 阻止表单默认刷新行为，并通过 isSubmitting 变量加锁，防止用户连点造成网络拥堵和数据重复。
           2. 改变提交按钮的文本和禁用状态，提供即时的 UI 反馈。
           3. 收集输入框的值，并查找所有带有 active 类的关键词按钮，提取出纯文本数组存入 selectedKws。
           4. 调用 Supabase API，向 posts 表插入新记录并用 select('id') 取回新帖子 id。
           5. 如果用户附带图片，等待图片转换完成后上传到 photos/{帖子id}.webp。
           6. 发帖成功后，查询并在 users 表中给当前用户的积分加上 10 分，更新本地存储。
           7. 处理完毕则弹窗并跳转回首页。如果过程中发生任何错误，catch 会捕获异常，解除提交锁并恢复按钮原始状态。
         */
        document.getElementById('pForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            // 如果已经在提交中，直接静默退出
            if (isSubmitting) return;

            // 立即上锁
            isSubmitting = true;

            const submitBtn = document.getElementById('submit-btn');
            const originalText = submitBtn.innerText;

            // 禁用按钮并改变文字
            submitBtn.disabled = true;
            submitBtn.innerText = lang === 'zh' ? "发布中..." : "Posting...";

            const title = document.getElementById('t').value.trim();
            const content = document.getElementById('c').value.trim();

            // 抓取所有被选中的关键词按钮文本
            const selectedKws = Array.from(document.querySelectorAll('.kw-btn.active'))
                .map(btn => btn.innerText);

            try {
                // 如果用户刚刚粘贴/拖拽了图片，等待转换结束，保证上传到 Storage 的一定是 WebP。
                if (photoConversionPromise) {
                    await photoConversionPromise;
                }

                // 发帖，并取回数据库生成的 id，后续图片文件名会使用这个 id。
                const { data: postData, error: postErr } = await _supabase.from('posts').insert([{
                    nickname: user,
                    title: title,
                    content: content,
                    likes: 0,
                    keywords: selectedKws
                }]).select('id').single();

                if (postErr) throw postErr;

                // 图片不是必填项；有图片时才上传到 photos 桶，文件名固定为 “帖子id.webp”。
                let photoWarning = '';
                if (selectedPhotoBlob) {
                    try {
                        submitBtn.innerText = lang === 'zh' ? "上传图片中..." : "Uploading image...";
                        await uploadPostPhoto(postData.id, selectedPhotoBlob);
                    } catch (photoErr) {
                        console.error("[图片上传失败]", photoErr);
                        const reason = photoErr.message ? `：${photoErr.message}` : '';
                        photoWarning = lang === 'zh'
                            ? `\n但图片上传失败了${reason}。请检查 photos 桶的 Storage policy 是否允许上传。`
                            : `\nBut the image upload failed${reason}. Please check whether the photos bucket Storage policy allows uploads.`;
                    }
                }

                // 自动加 10 分
                const { data: userData } = await _supabase.from('users').select('points').eq('username', user).single();
                const newPts = (userData ? userData.points : 0) + 10;

                await _supabase.from('users').update({ points: newPts }).eq('username', user);
                localStorage.setItem('userPoints', newPts);

                alert((lang === 'zh' ? "发布成功！积分+10" : "Success! Points +10") + photoWarning);
                window.location.href = 'index.html';

            } catch (err) {
                alert("Error: " + err.message);
                console.error("[错误]" + err);

                // 如果出错，释放锁并恢复按钮
                isSubmitting = false;
                submitBtn.disabled = false;
                submitBtn.innerText = originalText;
            }
        });
    </script>
</body>

</html>
